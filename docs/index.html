<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আনন্দধারা · Anandadhara</title>
<meta name="description" content="Anandadhara: all Rabindrasangeet songs with parjay, raag, taal, lyrics, moods and YouTube recordings, plus a mood jukebox.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3e9d6">
<script>
  // Theme and language before the first paint: remembered choices, otherwise the system scheme and Bengali.
  (function () {
    var h = document.documentElement, th = null, lg = null;
    try { th = localStorage.getItem("anandadhara.theme"); lg = localStorage.getItem("anandadhara.lang"); } catch (e) { /* storage unavailable */ }
    try { var q = new URLSearchParams(location.search); if (q.get("theme")) th = q.get("theme"); if (q.get("lang")) { lg = q.get("lang"); localStorage.setItem("anandadhara.lang", lg); } } catch (e) { /* ignore */ }
    if (th !== "light" && th !== "dark") th = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    h.dataset.theme = th;
    if (lg === "en" || lg === "bn") h.lang = lg;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Noto+Serif+Bengali:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body data-page="home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- the mark: one single-weight line-drawn alpona lotus -->
  <symbol id="mark" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="21"/><circle cx="24" cy="24" r="2.2"/>
    <path d="M24 24c-4-5-4-12 0-17 4 5 4 12 0 17zM24 24c5-4 12-4 17 0-5 4-12 4-17 0zM24 24c4 5 4 12 0 17-4-5-4-12 0-17zM24 24c-5 4-12 4-17 0 5-4 12-4 17 0z"/>
    <path d="M24 24c-1-6 3-11 9-12-1 6-5 11-9 12zM24 24c6-1 11 3 12 9-6-1-11-5-12-9zM24 24c1 6-3 11-9 12 1-6 5-11 9-12zM24 24c-6 1-11-3-12-9 6 1 11 5 12 9z" opacity=".7"/>
    <path d="M24 4.5v2M43.5 24h-2M24 43.5v-2M4.5 24h2" opacity=".8"/></g></symbol>
  <symbol id="divider" viewBox="0 0 64 20"><g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M2 10q10-8 20 0t20 0 20 0"/><path d="M32 10c-3-4-3-8 0-9 3 1 3 5 0 9zM32 10c3 4 3 8 0 9-3-1-3-5 0-9z"/><circle cx="12" cy="6" r="1"/><circle cx="52" cy="6" r="1"/></g></symbol>
</defs></svg>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#mark"/></svg><span class="brand-bn">আনন্দধারা</span><small>Anandadhara</small></a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home" data-i18n="listen"></a>
      <a href="#/browse/popular" data-nav="browse" data-i18n="browse"></a>
      <a href="#/jukebox" data-nav="jukebox" data-i18n="jukebox"></a>
      <a href="#/mine" data-nav="mine" data-i18n="mine"></a>
    </nav>
    <span class="spacer"></span>
    <button class="pill lang-switch" type="button" id="lang-switch"></button>
    <button class="pill icon theme-toggle" type="button" data-i18n-aria="theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <span class="account" id="account" hidden></span>
  </div>
</header>

<main id="view" class="wrap" tabindex="-1">
  <p class="loading" data-i18n="loading"></p>
</main>

<!-- The jukebox stays in the page on every route (moved off-screen when not shown) so playback continues. -->
<section id="jukebox" class="jukebox wrap offstage" aria-hidden="true" data-i18n-aria="jukebox">
  <div class="jb-stage">
    <div class="jb-main">
      <div class="jb-player">
        <div id="yt-player"></div>
        <div class="jb-empty" id="jb-empty">
          <p id="jb-empty-msg"></p>
          <button class="btn" type="button" id="jb-empty-play"></button>
          <button class="btn ghost sm" type="button" id="jb-empty-clear" hidden></button>
        </div>
      </div>
      <div class="jb-now" id="jb-now"></div>
      <div class="seek">
        <span id="jb-cur">0:00</span>
        <input type="range" id="jb-seek" min="0" max="1000" value="0" step="1" data-i18n-aria="seekAria" disabled>
        <span id="jb-dur">–:––</span>
      </div>
      <div class="jb-controls">
        <button id="jb-like" class="rnd" type="button" disabled aria-pressed="false" data-i18n-aria="like" data-i18n-title="likeT"></button>
        <button id="jb-prev" class="rnd" type="button" disabled data-i18n-aria="prev"></button>
        <button id="jb-play" class="big" type="button" data-i18n-aria="play"></button>
        <button id="jb-skip" class="rnd" type="button" disabled data-i18n-aria="next"></button>
        <button id="jb-edit" class="rnd" type="button" aria-expanded="false" aria-controls="sheet" data-i18n-aria="filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
      </div>
      <div class="jb-acts" id="jb-acts"></div>
      <p class="jb-next hint" id="jb-next"></p>
      <div id="jb-lyrics"></div>
    </div>
    <div class="jb-side">
      <div class="jb-filterbar">
        <span class="jb-count" id="jb-count"></span>
        <div class="jb-active" id="jb-active"></div>
      </div>
      <section class="jb-queue" aria-labelledby="jb-queue-h">
        <div class="section-head"><h2 id="jb-queue-h"></h2><span class="hint" id="jb-queue-count"></span></div>
        <ol class="queue" id="jb-queue"></ol>
        <button class="btn ghost sm" type="button" id="jb-queue-more" hidden></button>
      </section>
    </div>
  </div>
</section>

<footer class="foot wrap">
  <p data-i18n-html="footer1"></p>
  <p data-i18n-html="footer2"></p>
</footer>

<!-- the persistent player bar: on every page except the jukebox -->
<div class="mini" id="mini" hidden role="region" data-i18n-aria="nowPlaying">
  <div class="prog"><i id="mini-bar"></i></div>
  <img class="thumb" id="mini-thumb" src="" alt="">
  <a class="meta" id="mini-title" href="#/jukebox"><b id="mini-main"></b><span id="mini-sub"></span></a>
  <span class="time" id="mini-time"></span>
  <a class="btn icon sm ghost yt" id="mini-yt" href="https://www.youtube.com/" target="_blank" rel="noopener" data-i18n-aria="openYt" data-i18n-title="openYtT"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8.5C3 6.6 4.6 5 6.5 5h11C19.4 5 21 6.6 21 8.5v7c0 1.9-1.6 3.5-3.5 3.5h-11C4.6 19 3 17.4 3 15.5z"/><path d="M10 9v6l5-3z" fill="currentColor" stroke="none"/></svg></a>
  <div class="ctl">
    <button class="likeb" type="button" id="mini-like" aria-pressed="false" data-i18n-aria="like"></button>
    <button class="pp" type="button" id="mini-play" data-i18n-aria="play"></button>
    <button type="button" id="mini-skip" data-i18n-aria="next"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5v14l10-7zM16 5h3v14h-3z"/></svg></button>
  </div>
</div>

<nav class="tabs" aria-label="Main">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg><span data-i18n="listen"></span></a>
  <a href="#/browse/popular" data-nav="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span data-i18n="browse"></span></a>
  <a href="#/jukebox" data-nav="jukebox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span data-i18n="jukebox"></span></a>
  <a href="#/mine" data-nav="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20.5 3.9 12.4a4.6 4.6 0 0 1 6.5-6.5l1.6 1.6 1.6-1.6a4.6 4.6 0 0 1 6.5 6.5z"/></svg><span data-i18n="mine"></span></a>
</nav>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <div class="handle" aria-hidden="true"></div>
  <h3><span id="sheet-title" data-i18n="filters"></span><span class="cnt" id="sheet-count"></span></h3>
  <div id="jb-filters"></div>
  <div class="sheet-foot"><button class="btn ghost sm" type="button" id="sheet-clear" data-i18n="clearAll"></button><button class="btn sm" type="button" id="sheet-done" data-i18n="done"></button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="dlg" id="resume" aria-labelledby="resume-title">
  <svg class="dlg-mark" viewBox="0 0 48 48" aria-hidden="true"><use href="#mark"/></svg>
  <h2 id="resume-title"></h2>
  <p id="resume-text"></p>
  <div class="dlg-btns"><button class="btn sm" type="button" id="resume-yes"></button><button class="btn ghost sm" type="button" id="resume-no"></button></div>
</dialog>

<script src="app.js?v=13"></script>
<script type="module" src="sync.js?v=1"></script>
</body>
</html>

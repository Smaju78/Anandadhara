<!doctype html>
<html lang="bn" data-concept="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আনন্দধারা · A — পাণ্ডুলিপি Pandulipi</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Galada&family=Hind+Siliguri:wght@400;500;600&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== A · পাণ্ডুলিপি — the Gitabitan manuscript: aged paper, blue-black fountain-pen ink, a red margin rule,
   dotted index leaders, and Tagore's strike-through doodles as the only ornament. ===== */
:root{
  --paper:#efe5cf; --sheet:#f7f0df; --sheet2:#fbf6ea; --ink:#241e19; --ink2:#5d5247; --ink3:#8a7e70;
  --rule:#d9cdb0; --rule2:#c6b893; --red:#a8321e; --red-soft:#f0d8cf; --blue:#1f3566; --blue-soft:#dfe3ee; --on-blue:#fbf6ea;
  --wash:#e7dcc2; --shadow:0 10px 30px rgba(60,40,10,.12);
  --bn:"Tiro Bangla","Noto Serif Bengali",serif; --hand:"Galada","Tiro Bangla",cursive; --ui:"Hind Siliguri","Alegreya Sans",system-ui,sans-serif; --en:"Alegreya",Georgia,serif;
  --bar:66px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#12141b; --sheet:#1a1d26; --sheet2:#20242f; --ink:#ece4d2; --ink2:#b3a894; --ink3:#817867;
  --rule:#2d3240; --rule2:#3b4152; --red:#e27a5f; --red-soft:#3a2520; --blue:#9fb3df; --blue-soft:#232b3f; --on-blue:#12141b;
  --wash:#171a22; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme=dark]{
  --paper:#12141b; --sheet:#1a1d26; --sheet2:#20242f; --ink:#ece4d2; --ink2:#b3a894; --ink3:#817867;
  --rule:#2d3240; --rule2:#3b4152; --red:#e27a5f; --red-soft:#3a2520; --blue:#9fb3df; --blue-soft:#232b3f; --on-blue:#12141b;
  --wash:#171a22; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;overflow-x:hidden;
  background-image:radial-gradient(120% 60% at 50% -20%,rgba(255,255,255,.35),transparent 60%);padding-bottom:calc(var(--bar) + 24px + env(safe-area-inset-bottom))}
:root[data-theme=dark] body,:root:not([data-theme=light]) body{background-image:none}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) body{background-image:radial-gradient(120% 60% at 50% -20%,rgba(255,255,255,.35),transparent 60%)}}
a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}
#view:focus,#view:focus-visible{outline:none}
h1,h2,h3{margin:0;font-weight:400;line-height:1.2;text-wrap:balance}
.bn{font-family:var(--bn)}
.en{font-family:var(--en)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1140px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
.hint{color:var(--ink3);font-size:.86rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---- header: the manuscript cover ---- */
.top{border-bottom:1px solid var(--rule2);background:linear-gradient(var(--sheet),var(--paper))}
.top .wrap{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding-top:14px;padding-bottom:0}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.brand .mark{font-family:var(--hand);font-size:2.3rem;line-height:1;color:var(--blue);letter-spacing:.01em;white-space:nowrap}
.brand small{font-family:var(--en);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
@media (max-width:640px){.brand small{display:none}}
.tools{display:flex;gap:6px;align-items:center}
.pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--rule2);background:var(--sheet2);color:var(--ink2);font-weight:500;font-size:.84rem;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--blue);color:var(--blue)}
.pill.ic{width:34px;padding:0;justify-content:center}
.pill svg{width:17px;height:17px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--on-blue);border:0;font-family:var(--en);font-weight:700;display:grid;place-items:center;position:relative}
.avatar.in::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#3b9b5a;border:2px solid var(--sheet)}
nav.main{grid-column:1/-1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 0;padding:0 16px}
nav.main::-webkit-scrollbar{display:none}
nav.main a{flex:0 0 auto;padding:10px 14px 8px;text-decoration:none;color:var(--ink2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:baseline}
nav.main a small{font-family:var(--en);font-size:.72rem;color:var(--ink3);letter-spacing:.06em}
nav.main a[aria-current=page]{color:var(--ink);border-color:var(--red)}
nav.main a:hover{color:var(--blue)}
@media (min-width:900px){
  .top .wrap{grid-template-columns:auto 1fr auto;padding-top:18px}
  nav.main{grid-column:auto;margin:0 0 -1px 28px;padding:0;align-self:end}
  nav.main a{padding:14px 16px 12px}
  .brand .mark{font-size:2.7rem}
}

/* ---- the date line: Tagore dated every page ---- */
.dateline{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--red);font-family:var(--bn);font-size:1.02rem;margin:18px 0 6px}
.dateline .en{color:var(--ink3);font-size:.9rem;font-style:italic}

/* ---- sheets: cards as leaves of paper ---- */
.sheet{background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);position:relative;padding:18px 18px 20px}
.sheet.ruled{background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-origin:content-box}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--rule2),transparent)}
.margin{position:relative;padding-left:42px}
.margin::before{content:"";position:absolute;left:28px;top:-18px;bottom:-20px;width:1px;background:var(--red);opacity:.65}
.sec{margin:26px 0 0}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-family:var(--bn);font-size:1.5rem}
.sec-h .en{color:var(--ink3);font-size:.95rem;font-style:italic}
.sec-h .more{margin-left:auto;font-size:.9rem}
.pg{font-family:var(--en);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
/* the doodle: a crossed-out line that became a creature */
.doodle{display:block;width:min(100%,360px);height:34px;color:var(--ink);opacity:.55;margin:18px auto 0}
:root[data-theme=dark] .doodle{opacity:.5}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--rule2);background:var(--sheet2);color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.pri:hover{color:var(--on-blue);filter:brightness(1.08)}
.btn.sm{height:32px;padding:0 12px;font-size:.86rem}
.btn.ic{width:40px;padding:0;justify-content:center}
.btn.ic.sm{width:32px}
.btn[aria-pressed=true]{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.btn.ai{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--rule2);background:var(--sheet2);color:var(--ink2);text-decoration:none;font-size:.86rem;font-weight:500}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip[aria-pressed=true],.chip.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip small{opacity:.7;font-variant-numeric:tabular-nums}
.chip:disabled{opacity:.4;cursor:default}
.chip.x::after{content:"×";margin-left:2px;opacity:.7}

/* ---- search ---- */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--rule2);background:var(--sheet2);border-radius:4px;margin-top:14px}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1.05rem;color:var(--ink);outline:none;font-family:var(--bn)}
.search svg{width:20px;height:20px;color:var(--ink3);flex:none}

/* ---- feelings sheet ---- */
.feel h2{font-family:var(--hand);font-size:2rem;color:var(--blue);line-height:1.1}
.feel textarea{width:100%;font:inherit;font-family:var(--bn);font-size:1.08rem;line-height:32px;padding:0 4px;border:0;border-bottom:1px solid var(--rule2);background:transparent;color:var(--ink);resize:vertical;min-height:64px;outline:none}
.feel textarea:focus{border-color:var(--blue)}
.feel textarea::placeholder{color:var(--ink3)}
.feel-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
.feel-row .go{margin-left:auto}
.feel-n{display:flex;gap:4px;align-items:center}
.feel-n input{width:4rem;font:inherit;padding:4px 8px;border:1px solid var(--rule2);border-radius:999px;background:var(--sheet2);color:var(--ink)}
.feel-out{margin-top:14px;display:grid;gap:10px}
.feel-out p{margin:0}

/* ---- season band ---- */
.season{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center;padding:14px 18px;border:1px solid var(--rule2);background:var(--sheet2);margin-top:10px}
.season .nm{font-family:var(--bn);font-size:1.7rem;line-height:1.1}
.season .nm span{color:var(--ink3);font-size:1rem;font-family:var(--en);font-style:italic;margin-left:8px}
.season p{margin:2px 0 0;color:var(--ink2)}
@media (max-width:560px){.season{grid-template-columns:1fr}}

/* ---- index (table of contents with dotted leaders) ---- */
.toc{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:0 32px}
@media (min-width:700px){.toc{grid-template-columns:1fr 1fr}}
.toc li{display:flex;align-items:baseline;gap:6px;padding:7px 0;border-bottom:1px solid transparent}
.toc button,.toc a{font:inherit;background:none;border:0;padding:0;color:var(--ink);text-align:left;text-decoration:none;display:flex;align-items:baseline;gap:6px;flex:1;min-width:0}
.toc .nm{font-family:var(--bn);font-size:1.12rem;white-space:nowrap}
.toc .ds{color:var(--ink3);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toc .lead{flex:1;border-bottom:1px dotted var(--rule2);min-width:16px;transform:translateY(-4px)}
.toc .n{font-variant-numeric:tabular-nums;color:var(--blue);font-weight:500;white-space:nowrap}
.toc .n.off{color:var(--ink3);font-weight:400;font-size:.82rem}
.toc button:hover .nm,.toc a:hover .nm{color:var(--blue)}
.toc button:disabled .nm{color:var(--ink3)}

/* ---- song rows ---- */
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule2)}
.rows li{border-bottom:1px solid var(--rule)}
.rows a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 14px;padding:9px 2px;text-decoration:none;color:var(--ink)}
.rows a:hover{background:var(--sheet2)}
.rows .t{font-family:var(--bn);font-size:1.12rem;line-height:1.35}
.rows .t2{color:var(--ink3);font-size:.84rem;font-family:var(--en);font-style:italic}
.rows .m{grid-row:1/span 2;grid-column:2;align-self:center;text-align:right;font-size:.82rem;color:var(--ink3);white-space:nowrap;display:grid;justify-items:end}
.rows .m b{color:var(--red);font-weight:500}
.rows li.nr .t{color:var(--ink2)}
.rows .div{padding:12px 2px 4px;color:var(--red);font-family:var(--en);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase}
.list-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 8px}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:.86rem;color:var(--ink2);cursor:pointer}
.more-row{margin-top:12px}

/* ---- browse: index tabs along the edge ---- */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:8px 14px;text-decoration:none;color:var(--ink2);border:1px solid var(--rule2);border-bottom:0;background:var(--wash);font-size:.92rem;border-radius:3px 3px 0 0}
.tabs a[aria-current=page]{background:var(--sheet);color:var(--ink);font-weight:600;position:relative;top:1px}
.tabsheet{border-top:1px solid var(--rule2)}
.crumb{color:var(--ink3);font-size:.86rem;margin:16px 0 4px}
.list-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 12px}
.list-h h1{font-family:var(--bn);font-size:2rem}
.list-h .n{color:var(--ink3)}
.subtabs{margin:-4px 0 14px}

/* ---- song page: the leaf and its marginalia ---- */
.song{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:16px}
@media (min-width:900px){.song{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:start}}
.song h1{font-family:var(--bn);font-size:clamp(1.8rem,5.5vw,2.6rem);line-height:1.25}
.song .t2{font-family:var(--en);font-style:italic;color:var(--ink2);font-size:1.1rem;margin:4px 0 14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.lyrics{white-space:pre-wrap;font-family:var(--bn);font-size:1.2rem;line-height:32px;margin:0;max-width:62ch}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0 0 18px}
.facts dt{color:var(--red);font-family:var(--en);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding-top:4px}
.facts dd{margin:0}
.facts dd .sub{color:var(--ink3);font-size:.86rem;margin-left:6px}
.src{font-size:.84rem;color:var(--ink3);margin-top:14px}
.vid{margin:0 0 16px;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.vid .fr{position:relative;aspect-ratio:16/9;background:#000;border:3px solid var(--sheet2);box-shadow:0 2px 6px rgba(0,0,0,.25);overflow:hidden}
.vid .fr img{width:100%;height:100%;object-fit:cover;display:block}
.vid .fr button{position:absolute;inset:0;border:0;background:transparent;display:grid;place-items:center}
.vid .fr button span{width:34px;height:24px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;font-size:12px}
.vid .fr button:hover span{background:var(--red)}
.vid figcaption{font-size:.92rem;line-height:1.4}
.vid figcaption .s{font-family:var(--bn);font-size:1.02rem}
.vid figcaption small{display:block;color:var(--ink3);font-variant-numeric:tabular-nums}
.vid .yt{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;color:var(--ink2);margin-top:3px}
.vid .yt svg{width:14px;height:14px}
@media (min-width:600px){.vid{grid-template-columns:168px 1fr}}

/* ---- jukebox: the evening's sheet ---- */
.jb{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:900px){.jb{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:start}}
.stage{position:relative;aspect-ratio:16/9;background:#0e0f14;border:6px solid var(--sheet2);box-shadow:var(--shadow);overflow:hidden}
.stage iframe,.stage img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.stage .empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:16px;color:#e9e1cf;font-family:var(--bn);font-size:1.05rem}
.stage .empty p{margin:0;max-width:34ch}
.stage .paused{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45)}
.stage .paused button{width:72px;height:72px;border-radius:50%;border:0;background:var(--sheet);color:var(--ink);font-size:28px}
.now h2{font-family:var(--bn);font-size:1.7rem;line-height:1.25}
.now h2 a{color:var(--ink);text-decoration:none}
.now h2 a:hover{text-decoration:underline}
.now .t2{font-family:var(--en);font-style:italic;color:var(--ink2);margin:2px 0 6px}
.now .meta{color:var(--ink2);font-size:.92rem;margin:0 0 8px}
.now .meta b{font-weight:600;color:var(--ink)}
.seek{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--ink3);font-variant-numeric:tabular-nums;margin:12px 0}
.seek .trk{flex:1;height:2px;background:var(--rule2);position:relative}
.seek .trk i{position:absolute;left:0;top:0;bottom:0;background:var(--red);width:0}
.seek .trk i::after{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.ctls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctls .big{width:56px;height:56px;border-radius:50%;background:var(--blue);color:var(--on-blue);border:0;display:grid;place-items:center}
.ctls .big svg{width:26px;height:26px}
.next{margin:10px 0 0;color:var(--ink2);font-size:.9rem}
.jl{margin-top:14px;max-height:14rem;overflow:auto;border-top:1px solid var(--rule);padding-top:8px}
.jl .lyrics{font-size:1.05rem;line-height:1.8}
.fbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--rule2)}
.fbar .cnt{font-weight:600;font-variant-numeric:tabular-nums}
.fbar .act{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.filters fieldset{border:1px solid var(--rule2);background:var(--sheet2);padding:8px 10px 10px;margin:0;min-width:0}
.filters legend{font-family:var(--en);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);padding:0 4px}
.find{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--rule2);background:var(--sheet);margin-bottom:8px}
.find input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:none}
.find svg{width:16px;height:16px;color:var(--ink3)}
.queue{list-style:none;margin:8px 0 0;padding:0;counter-reset:q}
.queue li{display:grid;grid-template-columns:2rem auto 1fr auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--rule)}
.queue li.now{background:var(--sheet2);box-shadow:inset 3px 0 0 var(--red)}
.queue .num{color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right;font-family:var(--bn)}
.queue .t{font-family:var(--bn);font-size:1.05rem;color:var(--ink);text-decoration:none;display:block;line-height:1.3}
.queue .s{display:block;font-size:.82rem;color:var(--ink3)}
.queue .s b{color:var(--ink);font-weight:500}
.queue .tag{display:inline-block;font-family:var(--en);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-left:6px}
.queue .lk{color:var(--red)}
.queue .ex{display:flex;gap:4px}

/* ---- mine ---- */
.acct{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 16px;margin:14px 0 18px}
.acct .avatar{width:44px;height:44px;font-size:1.1rem}
.acct p{margin:0}
.acct .btn{grid-column:1/-1;justify-self:start}
@media (min-width:600px){.acct{grid-template-columns:auto 1fr auto}.acct .btn{grid-column:auto}}

/* ---- persistent player bar: a bookmark ribbon with a red hairline progress ---- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule2);box-shadow:0 -8px 24px rgba(40,25,0,.12);
  padding:0 max(12px,env(safe-area-inset-left)) env(safe-area-inset-bottom) max(12px,env(safe-area-inset-right))}
.bar .prog{position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--rule)}
.bar .prog i{display:block;height:100%;background:var(--red);width:0}
.bar .in{height:var(--bar);display:flex;align-items:center;gap:10px;max-width:1140px;margin:0 auto}
.bar .th{width:66px;height:42px;object-fit:cover;flex:none;border:2px solid var(--sheet2);box-shadow:0 1px 4px rgba(0,0,0,.3);background:#000}

.bar .ctl{display:flex;gap:2px;flex:none}
.bar .ctl button{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.bar .ctl button:hover{background:var(--wash)}

/* ---- welcome back ---- */
.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + 16px + env(safe-area-inset-bottom));z-index:21;width:min(520px,calc(100% - 24px));

/* ---- account popover ---- */
.pop{position:absolute;right:16px;top:64px;z-index:30;width:min(320px,calc(100% - 32px));background:var(--sheet2);border:1px solid var(--rule2);box-shadow:var(--shadow);padding:14px}

.pop .btn{width:100%;justify-content:center}
.pop .g{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:.86rem;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{margin-top:40px;padding:20px 0 10px;border-top:1px solid var(--rule2);color:var(--ink3);font-size:.84rem}

.loading{padding:60px 0;text-align:center;color:var(--ink3);font-family:var(--bn)}

<script src="common.js"></script>
<script>
(() => {
const { $, $$, esc, enc, state, t, num, nameOf, moodDesc, player, on, emit } = AD;
let D = null, cur = { page: "home", parts: [] }, resumeDismissed = false;
const icon = (id) => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const doodle = () => `<svg class="doodle" aria-hidden="true"><use href="#doodle"/></svg>`;
const toast = (m) => { const el = $("#toast"); el.textContent = m; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 1800); };
const songHref = (s) => `#/song/${enc(s.id)}`;
const bnToday = () => { const d = AD.bengaliDate(), sn = AD.currentSeason(); return `<span>${esc(d.text)}</span><span class="en">${state.lang === "bn" ? `${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })} · ${sn}` : `${AD.SEASONS[sn].bn} · ${AD.SEASONS[sn].monthsEn}`}</span>`; };

/* ---------- shell ---------- */
function renderNav() {
  const items = [["home", "listen", "Listen"], ["browse/popular", "browse", "Browse"], ["jukebox", "jukebox", "Jukebox"], ["mine", "mine", "Mine"]];
  const active = { home: "home", song: "home", browse: "browse/popular", list: "browse/popular", jukebox: "jukebox", mine: "mine" }[cur.page] || "home";
  $("#nav").innerHTML = items.map(([h, k, en]) => `<a href="#/${h === "home" ? "" : h}"${h === active ? ' aria-current="page"' : ""}>${t(k)}${state.lang === "bn" ? `<small>${en}</small>` : ""}</a>`).join("");
  $("#lang").textContent = t("language");
  $("#acct").textContent = state.signedIn ? "Y" : "S"; $("#acct").classList.toggle("in", !!state.signedIn);
  $("#foot").innerHTML = `<p>${t("footer")}</p><p class="conc">Design concept A · পাণ্ডুলিপি Pandulipi — the Gitabitan manuscript. Prototype over the real songs.json; the progress line is simulated.</p>`;
}
function renderPop() {
  const p = $("#pop");
  p.innerHTML = `<h3>${t("account")}</h3>
    <div class="row">${state.signedIn ? `<div><b>${esc(state.email)}</b><small>${t("syncedAs", state.email)}</small></div><button class="btn sm" id="p-out" type="button">${t("signOut")}</button>`
      : `<div style="flex:1"><button class="btn" id="p-in" type="button">${icon("i-g")} ${t("signIn")}</button><small style="display:block;margin-top:6px;color:var(--ink3)">${t("signInHint")}</small></div>`}</div>
    <div class="row"><label><input type="checkbox" id="p-prem"${state.premium ? " checked" : ""}><span>${t("premium")}<small>${t("premiumHint")}</small></span></label></div>
    <div class="row"><span>${t("theme")}</span><button class="pill ic" id="p-theme" type="button" aria-label="${t("theme")}">${icon("i-moon")}</button></div>
    <div class="row"><span>${state.lang === "bn" ? "ভাষা" : "Language"}</span><button class="pill" id="p-lang" type="button">${t("language")}</button></div>
    <p class="hint" style="margin:8px 0 0">${t("demoNote")}</p>`;
  const b = $("#p-in"); if (b) b.onclick = () => { AD.signIn(); toast(t("syncedAs", state.email)); };
  const o = $("#p-out"); if (o) o.onclick = AD.signOut;
  $("#p-prem").onchange = (e) => AD.setPremium(e.target.checked);
  $("#p-theme").onclick = AD.toggleTheme;
  $("#p-lang").onclick = () => AD.setLang(state.lang === "bn" ? "en" : "bn");
}
function renderResume() {
  const r = state.resume, el = $("#resume");
  const show = r && !resumeDismissed && !player.current && D.BY_ID.get(r.id);
  el.hidden = !show; if (!show) return;
  const s = D.BY_ID.get(r.id), v = s.videos.find((x) => x.id === r.vid) || s.videos[0];
  el.innerHTML = `<div><div class="kick">${t("welcome")}</div><p>${t("continueQ", `“${esc(AD.title(s))}”`)} <span class="hint">${AD.fmtTime(r.pos)} / ${AD.fmtTime(v.sec)}${(v.singers || []).length ? ` · ${esc(nameOf("singer", v.singers[0]))}` : ""}</span></p></div>
    <div class="acts"><button class="btn pri sm" id="r-go" type="button">${icon("i-play")} ${t("cont")}</button><button class="btn sm" id="r-no" type="button">${t("dismiss")}</button></div>`;
  $("#r-go").onclick = () => { player.play(s, v, r.pos); AD.go("#/jukebox"); };
  $("#r-no").onclick = () => { resumeDismissed = true; renderResume(); };
}
function renderBar() {
  const c = player.current, bar = $("#bar");
  bar.hidden = !c; document.body.classList.toggle("has-bar", !!c);
  if (!c) return;
  const s = c.song, v = c.video, singers = (v.singers || []).map((x) => nameOf("singer", x));
  $("#bar-in").innerHTML = `<img class="th" src="${AD.thumb(v, "mqdefault")}" alt="">
    <a class="meta" href="#/jukebox"><b>${esc(AD.title(s))}</b><span>${singers.length ? esc(singers.join(", ")) : esc(v.ch)}${player.upNext ? ` · ${t("upNext")}: ${esc(AD.title(player.upNext.song))}` : ""}</span></a>
    <span class="time" id="bar-t">${AD.fmtTime(player.pos)} / ${AD.fmtTime(v.sec)}</span>
    <a class="btn sm ic yt" href="${AD.ytWatch(v)}" target="_blank" rel="noopener" title="${t("openYt")}" aria-label="${t("openYt")}">${icon("i-yt")}</a>
    <div class="ctl">
      <button type="button" id="b-like" class="${AD.isLiked(s.id) ? "on" : ""}" aria-pressed="${AD.isLiked(s.id)}" aria-label="${t("like")}">${icon(AD.isLiked(s.id) ? "i-heart-f" : "i-heart")}</button>
      <button type="button" id="b-pp" class="pp" aria-label="${player.playing ? t("pause") : t("play")}">${icon(player.playing ? "i-pause" : "i-play")}</button>
      <button type="button" id="b-next" aria-label="${t("next")}">${icon("i-next")}</button>
    </div>`;
  $("#b-like").onclick = player.likeCurrent; $("#b-pp").onclick = player.toggle; $("#b-next").onclick = player.next;
  renderProgress();
}
function renderProgress() {
  const c = player.current; if (!c) return;
  const pct = Math.min(100, (player.pos / c.video.sec) * 100) + "%";
  $("#bar-i").style.width = pct; $("#seek-i").style.width = pct;
  const bt = $("#bar-t"); if (bt) bt.textContent = `${AD.fmtTime(player.pos)} / ${AD.fmtTime(c.video.sec)}`;
  $("#seek-a").textContent = AD.fmtTime(player.pos); $("#seek-b").textContent = AD.fmtTime(c.video.sec);
}

/* ---------- lists ---------- */
function row(s) {
  const meta = [nameOf("parjay", s.parjay), nameOf("raag", s.raag)].filter(Boolean).join(" · ");
  return `<li class="${AD.hasRec(s) ? "" : "nr"}"><a href="${songHref(s)}"><span class="t">${esc(AD.title(s))}</span>
    <span class="m">${AD.hasRec(s) ? `<b>▶ ${num(s.videos.length)}</b>` : ""}<span>${esc(meta)}</span></span>
    ${AD.title2(s) ? `<span class="t2">${esc(AD.title2(s))}</span>` : ""}</a></li>`;
}
function songList(list, { limit = 60, toggle = true, recFirst = true } = {}) {
  const wrap = document.createElement("div"); let shown = limit, recOnly = false;
  const draw = () => {
    const rec = list.filter(AD.hasRec), rest = list.filter((s) => !AD.hasRec(s));
    const all = recOnly ? rec : recFirst ? rec.concat(rest) : list, vis = all.slice(0, shown);
    const firstRest = recFirst ? vis.findIndex((s) => !AD.hasRec(s)) : -1;
    wrap.innerHTML = (toggle ? `<div class="list-tools"><label class="tog"><input type="checkbox" class="ro"${recOnly ? " checked" : ""}> ${t("recOnly", rec.length, list.length)}</label></div>` : "")
      + `<ul class="rows">${vis.map((s, i) => (i === firstRest && i > 0 ? `<li class="div">${t("noRec")}</li>` : "") + row(s)).join("") || `<li class="div">${t("noRec")}</li>`}</ul>`
      + (all.length > shown ? `<p class="more-row"><button class="btn sm" type="button">${t("showMore", Math.min(300, all.length - shown))}</button></p>` : "");
    const ro = $(".ro", wrap); if (ro) ro.onchange = (e) => { recOnly = e.target.checked; draw(); };
    const b = $(".more-row button", wrap); if (b) b.onclick = () => { shown += 300; draw(); };
  };
  draw(); return wrap;
}

/* ---------- home ---------- */
function renderHome() {
  const view = $("#view");
  view.innerHTML = `<div class="dateline">${bnToday()}</div>
    <div class="search"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="search" placeholder="${t("searchPh")}" aria-label="${t("search")}" autocomplete="off"></div>
    <div id="body"></div>`;
  const body = $("#body"), input = $("#q");
  const run = () => {
    if (input.value.trim()) { const res = AD.searchSongs(input.value); body.innerHTML = `<div class="sec"><div class="sec-h"><h2>${res.length ? t("found", res.length) : t("nothingFound")}</h2></div></div>`; body.append(songList(res, { recFirst: false })); }
    else renderListen(body);
  };
  input.oninput = run; run();
}
function renderListen(body) {
  const season = AD.currentSeason(), S = AD.SEASONS[season], SONGS = D.SONGS;
  const seasonN = SONGS.filter((s) => s.season === season && AD.hasRec(s)).length, totalRec = SONGS.filter(AD.hasRec).length;
  const pop = AD.popular(), popRec = pop.filter(AD.hasRec);
  body.innerHTML = `
    <section class="sec sheet ruled feel" id="feel" aria-labelledby="feel-h"></section>
    <section class="sec" aria-labelledby="h-listen">
      <div class="sec-h"><span class="pg">${num(1)}</span><h2 id="h-listen">${t("listenNow")}</h2><span class="hint">${t("ofSongs", totalRec, SONGS.length)}</span></div>
      <div class="season"><div><div class="nm">${t("seasonNow", state.lang === "bn" ? S.bn : season)}<span>${state.lang === "bn" ? S.months : S.monthsEn}</span></div>
        <p>${state.lang === "bn" ? S.note : S.noteEn} · ${seasonN ? t("seasonSongs", seasonN) : t("seasonSoon")}</p></div>
        <button class="btn pri" type="button" data-play="season:${season}"${seasonN ? "" : " disabled"}>${icon("i-play")} ${t("playSeason", state.lang === "bn" ? S.bn : season)}</button></div>
      <div class="sec-h" style="margin-top:18px"><h2 style="font-size:1.2rem">${t("moods")}</h2></div>
      <ol class="toc">${Object.keys(D.META.moods).map((m) => { const n = SONGS.filter((s) => AD.hasRec(s) && (s.moods || []).includes(m)).length;
        return `<li><button type="button" data-play="mood:${esc(m)}"${n ? "" : " disabled"}><span class="nm">${esc(nameOf("mood", m))}</span><span class="ds">${esc(moodDesc(m))}</span><span class="lead"></span><span class="n${n ? "" : " off"}">${n ? `▶ ${num(n)}` : t("comingSoon")}</span></button></li>`; }).join("")}</ol>
      ${doodle()}
    </section>
    <section class="sec" aria-labelledby="h-pop">
      <div class="sec-h"><span class="pg">${num(2)}</span><h2 id="h-pop">${t("wellKnown")}</h2><a class="more" href="#/browse/popular">${t("all", pop.length)}</a></div>
      <div id="pop"></div>
    </section>
    <section class="sec" aria-labelledby="h-ex">
      <div class="sec-h"><span class="pg">${num(3)}</span><h2 id="h-ex">${t("exploreAll", SONGS.length)}</h2></div>
      <div class="chips">${Object.entries(AD.KINDS).filter(([k]) => k !== "popular").map(([k, v]) => `<a class="chip" href="#/browse/${k}">${t(v.key)}</a>`).join("")}</div>
    </section>`;
  $("#pop", body).append(songList(popRec.length >= 12 ? popRec : pop, { limit: 12, toggle: false }));
  renderFeel($("#feel", body));
  $$("[data-play]", body).forEach((b) => b.onclick = () => { const [k, v] = b.dataset.play.split(":"); player.setFilter(k, v); player.start(); AD.go("#/jukebox"); });
}
function renderFeel(box) {

  const view = $("#view"), likes = state.likes.map((id) => D.BY_ID.get(id)).filter(Boolean), never = state.never.map((id) => D.BY_ID.get(id)).filter(Boolean), recent = state.recent.slice().reverse().slice(0, 12).map((id) => D.BY_ID.get(id)).filter(Boolean);
  view.innerHTML = `<div class="dateline">${bnToday()}</div><div class="list-h" style="margin-top:12px"><h1>${t("mineH")}</h1></div>
    <div class="sheet acct"><span class="avatar ${state.signedIn ? "in" : ""}" aria-hidden="true">${state.signedIn ? "Y" : "S"}</span><div><p><b>${state.signedIn ? esc(state.email) : t("notSigned")}</b></p><p class="hint">${state.signedIn ? t("syncedAs", state.email) : t("localOnly")}</p></div>
      ${state.signedIn ? `<button class="btn sm" id="m-out" type="button">${t("signOut")}</button>` : `<button class="btn" id="m-in" type="button">${icon("i-g")} ${t("signIn")}</button>`}</div>
    <section class="sec"><div class="sec-h"><h2>${t("likedSongs")}</h2><span class="hint">${t("songsCount", likes.length)}</span>${likes.some(AD.hasRec) ? `<button class="btn sm more" id="m-play" type="button">${icon("i-play")} ${t("playAll")}</button>` : ""}</div><div id="m-likes"></div></section>
    <section class="sec"><div class="sec-h"><h2>${t("recentH")}</h2></div><div id="m-recent"></div></section>
    <section class="sec"><div class="sec-h"><h2>${t("hiddenSongs")}</h2><span class="hint">${t("songsCount", never.length)}</span></div><ul class="rows" id="m-never">${never.map((s) => `<li><a href="${songHref(s)}"><span class="t">${esc(AD.title(s))}</span><span class="m"><button class="btn sm" type="button" data-un="${esc(s.id)}">${t("remove")}</button></span></a></li>`).join("") || `<li class="div">${t("none")}</li>`}</ul></section>`;
  if (likes.length) $("#m-likes").append(songList(likes, { toggle: false })); else $("#m-likes").innerHTML = `<div class="sheet empty"><b>${t("noneLiked")}</b><p>${t("noneLikedHint")}</p></div>`;
  if (recent.length) $("#m-recent").append(songList(recent, { toggle: false, recFirst: false })); else $("#m-recent").innerHTML = `<p class="hint">${t("none")}</p>`;
  const mi = $("#m-in"); if (mi) mi.onclick = () => { AD.signIn(); renderMine(); };
  const mo = $("#m-out"); if (mo) mo.onclick = () => { AD.signOut(); renderMine(); };
  const mp = $("#m-play"); if (mp) mp.onclick = () => { player.setFilters({ likedOnly: true }); player.start(); AD.go("#/jukebox"); };
  $$("[data-un]", view).forEach((b) => b.onclick = (e) => { e.preventDefault(); AD.toggleList("never", b.dataset.un, false); renderMine(); });
}

/* ---------- router ---------- */
function route() {
  cur = AD.parseHash(); const p = cur.page, parts = cur.parts;
  document.body.dataset.page = p;
  $("#jukebox").hidden = p !== "jukebox"; $("#view").hidden = p === "jukebox";
  renderNav(); renderResume(); renderBar();
  if (p === "jukebox") { renderJukebox(); window.scrollTo(0, 0); return; }
  if (p === "song") renderSong(parts[1]);
  else if (p === "browse") renderBrowse(parts[1]);
  else if (p === "list" && parts[1] === "parjay") renderList("parjay", parts[2], parts[3] || "");
  else if (p === "list") renderList(parts[1], parts.slice(2).join("/"));
  else if (p === "mine") renderMine();
  else renderHome();
  if (p !== "home") { window.scrollTo(0, 0); $("#view").focus({ preventScroll: true }); }
}
AD.load().then((d) => {
  D = d;
  $("#lang").onclick = () => AD.setLang(state.lang === "bn" ? "en" : "bn");
  $("#theme").onclick = AD.toggleTheme;
  $("#acct").onclick = (e) => { e.stopPropagation(); const p = $("#pop"); p.hidden = !p.hidden; $("#acct").setAttribute("aria-expanded", String(!p.hidden)); if (!p.hidden) renderPop(); };
  document.addEventListener("click", (e) => { if (!$("#pop").hidden && !e.target.closest("#pop")) { $("#pop").hidden = true; $("#acct").setAttribute("aria-expanded", "false"); } });
  on("lang", () => { renderPop(); route(); });
  on("account", () => { renderNav(); if (!$("#pop").hidden) renderPop(); });
  on("player", () => { renderBar(); renderResume(); if (cur.page === "jukebox") renderJukebox(); });
  on("progress", renderProgress);
  on("filters", () => { if (cur.page === "jukebox") { renderFilterBar(); renderQueue(); } });
  on("prefs", () => { renderBar(); if (cur.page === "jukebox") renderJukebox(); });
  window.addEventListener("hashchange", route); route();
});
})();
</script>
</body>
</html>

<!doctype html>
<html lang="bn" data-concept="d">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আনন্দধারা · D — শান্ত রাঙামাটি</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Noto+Serif+Bengali:wght@400;500&family=Hind+Siliguri:wght@400;500;600&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ===== D · শান্ত রাঙামাটি — Rangamati softened: rice-paper cream, warm ink, a dusty clay accent used only for
   hairlines, small labels, the active state and one primary button. One line-drawn alpona as the mark; quiet space. ===== */
:root{
  --paper:#f7f2e8; --paper2:#fbf8f1; --card:#fdfbf6; --ink:#2b2622; --ink2:#625a52; --ink3:#948a7e; --line:rgba(43,38,34,.1); --line2:rgba(43,38,34,.2);
  --clay:#b5695a; --clay-soft:#f1e3de; --clay-ink:#fbf6f0; --rule:#e6ddcf; --wash1:#f2e9d8; --wash2:#f7f2e8;
  --shadow:0 8px 28px rgba(80,60,40,.08); --tabs:60px; --bar:66px;
  --bn:"Tiro Bangla","Noto Serif Bengali",serif; --serif:"Noto Serif Bengali","Tiro Bangla",serif; --sans:"Hind Siliguri",system-ui,sans-serif; --en:"Alegreya",Georgia,serif; color-scheme:light;
}
[data-season=Grishma]{--wash1:#f3e6cf;--wash2:#f8f2e6}
[data-season=Barsha]{--wash1:#dfe4e4;--wash2:#f1f1ec}
[data-season=Sharat]{--wash1:#e0e9ee;--wash2:#f4f4ef}
[data-season=Hemanta]{--wash1:#efe3c8;--wash2:#f8f3e8}
[data-season=Sheet]{--wash1:#e8e6df;--wash2:#f5f3ee}
[data-season=Basanta]{--wash1:#f3dfd4;--wash2:#f9f1ea}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#1b1917; --paper2:#201d1b; --card:#262220; --ink:#e9e2d7; --ink2:#b7ada1; --ink3:#857b70; --line:rgba(233,226,215,.1); --line2:rgba(233,226,215,.2);
  --clay:#d4958a; --clay-soft:#3a2b27; --clay-ink:#1b1917; --rule:#312c29; --wash1:#2a2521; --wash2:#1f1c1a; --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
  [data-season=Grishma]:not([data-theme=light]){--wash1:#2e2820}[data-season=Barsha]:not([data-theme=light]){--wash1:#23282b}[data-season=Sharat]:not([data-theme=light]){--wash1:#232a30}
  [data-season=Hemanta]:not([data-theme=light]){--wash1:#2d2820}[data-season=Sheet]:not([data-theme=light]){--wash1:#282726}[data-season=Basanta]:not([data-theme=light]){--wash1:#2f2422}}
:root[data-theme=dark]{--paper:#1b1917; --paper2:#201d1b; --card:#262220; --ink:#e9e2d7; --ink2:#b7ada1; --ink3:#857b70; --line:rgba(233,226,215,.1); --line2:rgba(233,226,215,.2);
  --clay:#d4958a; --clay-soft:#3a2b27; --clay-ink:#1b1917; --rule:#312c29; --wash1:#2a2521; --wash2:#1f1c1a; --shadow:0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
:root[data-theme=dark][data-season=Grishma]{--wash1:#2e2820}:root[data-theme=dark][data-season=Barsha]{--wash1:#23282b}:root[data-theme=dark][data-season=Sharat]{--wash1:#232a30}
:root[data-theme=dark][data-season=Hemanta]{--wash1:#2d2820}:root[data-theme=dark][data-season=Sheet]{--wash1:#282726}:root[data-theme=dark][data-season=Basanta]{--wash1:#2f2422}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden;padding-bottom:calc(var(--tabs) + var(--bar) + 24px + env(safe-area-inset-bottom))}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--clay)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:3px}
#view:focus,#view:focus-visible{outline:none}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:500;line-height:1.3;text-wrap:balance}
.hint{color:var(--ink3);font-size:.86rem}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) 0 max(18px,env(safe-area-inset-right))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.lab{font-family:var(--en);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)}

/* ---- top bar ---- */
.top{border-bottom:1px solid var(--line);background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-family:var(--bn);font-size:1.5rem;line-height:1}
.brand svg{width:38px;height:38px;color:var(--clay);flex:none}
.brand small{display:none;font-family:var(--en);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-left:4px}
.topnav{display:none;gap:4px;margin-left:30px}
.topnav a{padding:8px 12px;text-decoration:none;color:var(--ink2);font-weight:500;border-bottom:1px solid transparent}
.topnav a:hover{color:var(--ink)}
.topnav a[aria-current=page]{color:var(--ink);border-color:var(--clay)}
.spacer{flex:1}
.pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);font-weight:500;font-size:.84rem;display:inline-flex;align-items:center;gap:6px;background:transparent}
.pill:hover{border-color:var(--clay);color:var(--clay)}
.pill.ic{width:34px;padding:0;justify-content:center}
.pill svg{width:17px;height:17px}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--card);color:var(--ink2);font-family:var(--en);font-weight:500;display:grid;place-items:center;position:relative}
.avatar.in::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#6a9a6a;border:2px solid var(--paper)}
@media (min-width:900px){.topnav{display:flex}.brand small{display:inline}.top .wrap{height:72px}body{padding-bottom:calc(var(--bar) + 40px)}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabs) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--paper2);border-top:1px solid var(--line)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-size:.76rem;font-weight:500;text-decoration:none}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current=page]{color:var(--clay)}
@media (min-width:900px){.tabs{display:none}}

/* ---- the quiet season wash ---- */
.hero{margin-top:22px;padding:30px 24px 28px;border-radius:6px;position:relative;overflow:hidden;background:
  radial-gradient(60% 90% at 85% 20%,var(--wash1),transparent 70%),radial-gradient(50% 70% at 10% 90%,var(--wash1),transparent 70%),var(--wash2);border:1px solid var(--line)}
.hero .date{font-family:var(--bn);font-size:1.02rem;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.hero .date .en{font-family:var(--en);font-style:italic;color:var(--ink3);font-size:.92rem}
.hero h1{font-family:var(--bn);font-weight:400;font-size:clamp(2rem,6vw,2.9rem);margin-top:10px;line-height:1.2}
.hero h1 small{display:block;font-family:var(--en);font-style:italic;font-size:1rem;color:var(--ink3);margin-top:4px}
.hero p{margin:8px 0 0;color:var(--ink2);max-width:46ch}
.hero .fest{margin-top:8px}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
@media (min-width:900px){.hero{padding:40px 44px 38px;margin-top:30px}}

/* ---- buttons / chips ---- */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--clay);color:var(--clay)}
.btn.pri{background:var(--clay);border-color:var(--clay);color:var(--clay-ink)}
.btn.pri:hover{color:var(--clay-ink);filter:brightness(1.05)}
.btn.sm{height:32px;padding:0 12px;font-size:.86rem}
.btn.ic{width:40px;padding:0;justify-content:center}
.btn.ic.sm{width:32px}
.btn[aria-pressed=true]{border-color:var(--clay);color:var(--clay);background:var(--clay-soft)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips.scroll::-webkit-scrollbar{display:none}
@media (min-width:900px){.chips.scroll{margin:0;padding:2px 0}}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink2);text-decoration:none;font-size:.86rem;font-weight:500}
.chip:hover{border-color:var(--clay);color:var(--clay)}
.chip[aria-pressed=true],.chip.on{border-color:var(--clay);color:var(--clay);background:var(--clay-soft)}
.chip small{opacity:.7;font-variant-numeric:tabular-nums}
.chip:disabled{opacity:.4;cursor:default}
.chip.x::after{content:"×";opacity:.7}

/* ---- sections ---- */
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-family:var(--bn);font-size:1.45rem;font-weight:400}
.sec-h .more{margin-left:auto;font-size:.9rem;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px}
/* the one hairline alpona divider */
.div-alp{display:flex;align-items:center;gap:14px;margin:40px 0 0;color:var(--clay);opacity:.8}
.div-alp::before,.div-alp::after{content:"";flex:1;height:1px;background:var(--line2)}
.div-alp svg{width:64px;height:20px}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 4px;border-bottom:1px solid var(--line2);margin-top:22px}
.search:focus-within{border-color:var(--clay)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-family:var(--bn);font-size:1.08rem;color:var(--ink);outline:none}
.search svg{width:20px;height:20px;color:var(--ink3);flex:none}

/* feelings */
.feel h2{font-size:1.5rem}
.feel textarea{width:100%;font:inherit;font-family:var(--bn);font-size:1.08rem;line-height:1.7;padding:10px 2px;border:0;border-bottom:1px solid var(--line2);background:transparent;color:var(--ink);resize:vertical;min-height:64px;margin-top:10px;outline:none}
.feel textarea:focus{border-color:var(--clay)}
.feel textarea::placeholder{color:var(--ink3)}
.feel-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:14px}
.feel-row .go{margin-left:auto}
.feel-n{display:flex;gap:4px;align-items:center}
.feel-n input{width:4rem;font:inherit;padding:4px 8px;border:1px solid var(--line2);border-radius:999px;background:transparent;color:var(--ink)}
.feel-out{margin-top:14px;display:grid;gap:10px}
.feel-out p{margin:0}

/* moods: gentle text labels with a tiny line glyph */
.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 24px}
@media (min-width:600px){.moods{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.moods{grid-template-columns:repeat(4,1fr)}}
.mood{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--ink)}
.mood:hover b{color:var(--clay)}
.mood svg{width:16px;height:16px;color:var(--clay);align-self:center;grid-row:1/span 2}
.mood b{font-family:var(--bn);font-weight:400;font-size:1.15rem}
.mood small{grid-column:2;color:var(--ink3);font-size:.78rem;line-height:1.3}
.mood .n{grid-column:3;grid-row:1/span 2;color:var(--ink3);font-size:.82rem;font-variant-numeric:tabular-nums;align-self:center}
.mood:disabled{opacity:.45;cursor:default}

/* rows */
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--line)}
.rows a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 14px;padding:11px 2px;text-decoration:none;color:var(--ink)}
.rows a:hover{background:var(--paper2)}
.rows .t{font-family:var(--bn);font-size:1.12rem;line-height:1.4}
.rows .t2{color:var(--ink3);font-size:.82rem;font-family:var(--en);font-style:italic}
.rows .m{grid-row:1/span 2;grid-column:2;align-self:center;text-align:right;font-size:.8rem;color:var(--ink3);white-space:nowrap;display:grid;justify-items:end;gap:2px}
.rows .m b{color:var(--clay);font-weight:500}
.rows li.nr .t{color:var(--ink2)}
.rows .div{padding:14px 2px 4px}
.list-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:.86rem;color:var(--ink2);cursor:pointer}
.more-row{margin-top:14px}

/* browse */
.kinds{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:18px -18px 0;padding:0 18px;border-bottom:1px solid var(--line)}
.kinds::-webkit-scrollbar{display:none}
.kinds a{flex:0 0 auto;padding:8px 12px;text-decoration:none;color:var(--ink2);font-weight:500;font-size:.92rem;border-bottom:1px solid transparent;margin-bottom:-1px}
.kinds a:hover{color:var(--ink)}
.kinds a[aria-current=page]{color:var(--clay);border-color:var(--clay)}
@media (min-width:900px){.kinds{margin:18px 0 0;padding:0}}
.groups{display:grid;grid-template-columns:1fr;gap:0 32px;margin-top:10px}
@media (min-width:700px){.groups{grid-template-columns:1fr 1fr}}
.group{display:flex;align-items:baseline;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.group:hover b{color:var(--clay)}
.group b{font-family:var(--bn);font-weight:400;font-size:1.1rem;white-space:nowrap}
.group small{color:var(--ink3);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.group .lead{flex:1;border-bottom:1px dotted var(--line2);min-width:14px;transform:translateY(-5px)}
.group .n{color:var(--ink3);font-size:.84rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.group .n b{font-family:var(--sans);font-size:.84rem;color:var(--clay)}
.find{display:flex;align-items:center;gap:8px;height:38px;padding:0 4px;border-bottom:1px solid var(--line2);max-width:400px;margin-top:16px}
.find:focus-within{border-color:var(--clay)}
.find input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:none}
.find svg{width:16px;height:16px;color:var(--ink3)}
.crumb{color:var(--ink3);font-size:.86rem;margin:18px 0 6px}
.crumb a{color:var(--ink3)}
.list-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 14px}
.list-h h1{font-family:var(--bn);font-weight:400;font-size:2rem}
.list-h .n{color:var(--ink3)}

/* song page: A's ruled leaf, softened */
.song{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;margin-top:10px}
@media (min-width:900px){.song{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:48px;align-items:start}}
.leaf{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:26px 24px 24px;position:relative;box-shadow:var(--shadow)}
.leaf.ruled{background-image:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px);background-origin:content-box}
.leaf::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:1px;background:var(--clay);opacity:.35}
.leaf h1{font-family:var(--bn);font-weight:400;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.3;padding-left:14px}
.leaf .t2{font-family:var(--en);font-style:italic;color:var(--ink2);font-size:1.05rem;margin:4px 0 16px;padding-left:14px}
.leaf .acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;padding-left:14px}
.lyrics{white-space:pre-wrap;font-family:var(--bn);font-size:1.18rem;line-height:34px;margin:0;max-width:60ch;padding-left:14px}
.leaf .src{font-size:.82rem;color:var(--ink3);margin-top:16px;padding-left:14px}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:0}
.facts dt{padding-top:4px}
.facts dd{margin:0}
.facts dd a{text-decoration:none;border-bottom:1px solid var(--line2)}
.facts dd a:hover{border-color:var(--clay)}
.facts dd .sub{color:var(--ink3);font-size:.84rem;margin-left:8px}
.vids{display:grid;gap:14px;margin-top:12px}
.vid{display:grid;grid-template-columns:124px 1fr;gap:12px;align-items:start;margin:0}
.vid .fr{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000;border-radius:4px}
.vid .fr img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.vid .fr button{position:absolute;inset:0;display:grid;place-items:center}
.vid .fr button span{width:34px;height:34px;border-radius:50%;background:rgba(253,251,246,.9);color:var(--ink);display:grid;place-items:center}
.vid .fr button span svg{width:16px;height:16px}
.vid figcaption{font-size:.9rem;line-height:1.4;min-width:0}
.vid figcaption .s{font-family:var(--bn);font-size:1.02rem}
.vid figcaption small{display:block;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid .yt{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;margin-top:3px;color:var(--ink2)}
.vid .yt svg{width:13px;height:13px}

/* jukebox */
.jb{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:900px){.jb{grid-template-columns:minmax(0,1.25fr) minmax(340px,.85fr);gap:48px;align-items:start}}
.stage{position:relative;aspect-ratio:16/9;background:#1a1715;overflow:hidden;border-radius:6px;box-shadow:var(--shadow)}
.stage iframe,.stage img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.stage .empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:16px;color:var(--ink2);background:radial-gradient(60% 90% at 80% 20%,var(--wash1),transparent 70%),var(--wash2)}
.stage .empty svg{width:72px;height:72px;color:var(--clay)}
.stage .empty p{margin:0;max-width:34ch;font-family:var(--bn);font-size:1.05rem}
.stage .paused{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.4)}
.stage .paused button{width:72px;height:72px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center}
.stage .paused button svg{width:30px;height:30px}
.now{margin-top:18px}
.now h2{font-family:var(--bn);font-weight:400;font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.3}
.now h2 a{text-decoration:none}
.now .t2{font-family:var(--en);font-style:italic;color:var(--ink2);margin:2px 0 6px}
.now .meta{color:var(--ink2);font-size:.92rem;margin:0 0 6px}
.now .meta b{color:var(--ink);font-weight:500}
.seek{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--ink3);font-variant-numeric:tabular-nums;margin:16px 0 10px}
.seek .trk{flex:1;height:2px;background:var(--line2);position:relative}
.seek .trk i{position:absolute;left:0;top:0;bottom:0;background:var(--clay);width:0}
.seek .trk i::after{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--clay)}
.ctls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctls .big{width:54px;height:54px;border-radius:50%;background:var(--clay);color:var(--clay-ink);display:grid;place-items:center}
.ctls .big svg{width:26px;height:26px}
.ctls .big:disabled{opacity:.4}
.jacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.next{margin:12px 0 0;color:var(--ink2);font-size:.9rem}
.jl{margin-top:18px}
.jl .leaf{padding:18px 20px}
.jl .lyrics{font-size:1.05rem;line-height:34px;max-height:17rem;overflow:auto}
.fbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.fbar .cnt{font-weight:500;font-variant-numeric:tabular-nums}
.fbar .act{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px}
.filters{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
.filters fieldset{border:0;border-top:1px solid var(--line);padding:10px 0 0;margin:0;min-width:0}
.filters legend{padding:0 6px 0 0}
.filters .find{margin:0 0 8px;height:34px;max-width:none}
.queue{list-style:none;margin:10px 0 0;padding:0}
.queue li{display:grid;grid-template-columns:1.8rem auto 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.queue li.now{background:var(--clay-soft)}
.queue .num{font-family:var(--bn);color:var(--ink3);text-align:right;font-size:.9rem}
.queue .t{font-family:var(--bn);font-size:1.05rem;color:var(--ink);display:block;line-height:1.35;text-decoration:none}
.queue .s{display:block;font-size:.8rem;color:var(--ink3)}
.queue .s b{color:var(--ink);font-weight:500}
.queue .tag{display:inline-block;font-family:var(--en);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);margin-left:8px}
.queue .lk{color:var(--clay)}
.queue .ex{display:flex;gap:4px}

/* mine */
.acct{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:14px 0 18px}
.acct .avatar{width:44px;height:44px;font-size:1.1rem}
.acct p{margin:0}
.acct .btn{grid-column:1/-1;justify-self:start}
@media (min-width:600px){.acct{grid-template-columns:auto 1fr auto}.acct .btn{grid-column:auto}}
.empty{text-align:center;color:var(--ink2);padding:30px 18px}
.empty b{display:block;font-family:var(--bn);font-size:1.3rem;font-weight:400;color:var(--ink)}
.empty p{margin:6px auto 0;max-width:36ch}

/* persistent player bar */
.bar{position:fixed;left:0;right:0;bottom:calc(var(--tabs) + env(safe-area-inset-bottom));z-index:31;height:var(--bar);background:var(--paper2);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 10px}
.bar .prog{position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--line)}
.bar .prog i{display:block;height:100%;background:var(--clay);width:0}
.bar .th{width:62px;height:40px;object-fit:cover;flex:none;background:#000;border-radius:3px;opacity:.92}
.bar .meta{flex:1;min-width:0;color:var(--ink);text-decoration:none}
.bar .meta b{display:block;font-family:var(--bn);font-weight:400;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.bar .meta span{display:block;font-size:.76rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .time{display:none;font-size:.74rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.bar .ctl{display:flex;gap:2px;flex:none}
.bar .ctl button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.bar .ctl button:hover{background:var(--clay-soft)}
.bar .ctl button.on{color:var(--clay)}
.bar .ctl .pp{background:var(--clay);color:var(--clay-ink)}
.bar .ctl svg{width:22px;height:22px}
.bar .yt,.bar .likeb{display:none}
@media (min-width:900px){.bar{bottom:0;height:72px;padding:0 32px;gap:18px}.bar .time,.bar .yt,.bar .likeb{display:inline-flex}.bar .ctl{gap:8px}.bar .meta{flex:0 1 420px}.bar .mid{flex:1;display:flex;justify-content:center}}
body[data-page=jukebox] .bar{display:none}

/* welcome back, popover, toast, footer */
.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + var(--bar) + 18px + env(safe-area-inset-bottom));z-index:32;width:min(500px,calc(100% - 28px));background:var(--card);border:1px solid var(--line2);border-radius:6px;box-shadow:0 12px 36px rgba(0,0,0,.18);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.resume svg{width:36px;height:36px;color:var(--clay);grid-row:1/span 2}
.resume .kick{font-family:var(--en);font-style:italic;color:var(--clay);font-size:1rem}
.resume p{margin:0;font-family:var(--bn);font-size:1rem}
.resume .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
@media (min-width:900px){.resume{bottom:calc(var(--bar) + 20px)}}
body[data-page=jukebox] .resume{bottom:calc(var(--tabs) + 16px)}
.pop{position:fixed;right:14px;top:70px;z-index:35;width:min(320px,calc(100% - 28px));background:var(--card);border:1px solid var(--line2);border-radius:6px;box-shadow:0 12px 36px rgba(0,0,0,.18);padding:16px}
.pop h3{font-family:var(--bn);font-weight:400;font-size:1.15rem;margin-bottom:8px}
.pop .r{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.pop .r:first-of-type{border-top:0}
.pop .r small{display:block;color:var(--ink3);font-size:.78rem}
.pop .r label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1}
.pop .r input{margin-top:4px;accent-color:var(--clay)}
.pop .btn{width:100%;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(var(--tabs) + var(--bar) + 26px);transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:.86rem;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{margin-top:56px;padding:22px 0 10px;border-top:1px solid var(--line);color:var(--ink3);font-size:.84rem}
.loading{padding:60px 0;text-align:center;color:var(--ink3);font-family:var(--bn)}
input[type=checkbox]{accent-color:var(--clay)}
</style>
</head>

<header class="top"><div class="wrap">

  <button class="avatar" id="acct" type="button" aria-haspopup="dialog" aria-expanded="false">S</button>
</div></header>

<script src="common.js"></script>
<script>
(() => {
const { $, $$, esc, enc, state, t, num, nameOf, moodDesc, player, on } = AD;
let D = null, cur = { page: "home", parts: [] }, resumeDismissed = false;
const icon = (id) => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const divider = () => `<div class="div-alp" aria-hidden="true"><svg><use href="#divider"/></svg></div>`;
const toast = (m) => { const el = $("#toast"); el.textContent = m; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 1800); };
const songHref = (s) => `#/song/${enc(s.id)}`;
const setSeason = (k) => { document.documentElement.dataset.season = k; };
function festival() {
  const d = AD.bengaliDate(), m = d.monthEn, day = d.day, bn = state.lang === "bn";
  if (m === "Baishakh" && day === 1) return bn ? "শুভ নববর্ষ" : "Noboborsho";
  if (m === "Baishakh" && day >= 23 && day <= 25) return bn ? "পঁচিশে বৈশাখ" : "25 Baishakh — Tagore's birthday";
  if (m === "Shraban" && day === 22) return bn ? "বাইশে শ্রাবণ" : "22 Shraban";
  if (m === "Poush" && day >= 7 && day <= 9) return bn ? "পৌষমেলা, শান্তিনিকেতন" : "Poush Mela at Santiniketan";
  return "";
}

/* ---- shell ---- */
function renderNav() {
  const items = [["", "listen", "i-home"], ["browse/popular", "browse", "i-search"], ["jukebox", "jukebox", "i-music"], ["mine", "mine", "i-heart"]];
  const active = { home: "", song: "", browse: "browse/popular", list: "browse/popular", jukebox: "jukebox", mine: "mine" }[cur.page] ?? "";
  $("#topnav").innerHTML = items.map(([h, k]) => `<a href="#/${h}"${h === active ? ' aria-current="page"' : ""}>${t(k)}</a>`).join("");
  $("#tabs").innerHTML = items.map(([h, k, i]) => `<a href="#/${h}"${h === active ? ' aria-current="page"' : ""}>${icon(i)}<span>${t(k)}</span></a>`).join("");
  $("#lang").textContent = t("language");
  $("#acct").textContent = state.signedIn ? "Y" : "S"; $("#acct").classList.toggle("in", !!state.signedIn);
  $("#foot").innerHTML = `<p>${t("footer")}</p><p><i>Design concept D · শান্ত রাঙামাটি — Rangamati softened. Prototype over the real songs.json; the progress line is simulated.</i></p>`;
}
function renderPop() {
  const p = $("#pop");
  p.innerHTML = `<h3>${t("account")}</h3>
    <div class="r">${state.signedIn ? `<div><b>${esc(state.email)}</b><small>${t("syncedAs", state.email)}</small></div><button class="btn sm" id="p-out" type="button">${t("signOut")}</button>`
      : `<div style="flex:1"><button class="btn" id="p-in" type="button">${icon("i-g")} ${t("signIn")}</button><small style="display:block;margin-top:6px;color:var(--ink3)">${t("signInHint")}</small></div>`}</div>
    <div class="r"><label><input type="checkbox" id="p-prem"${state.premium ? " checked" : ""}><span>${t("premium")}<small>${t("premiumHint")}</small></span></label></div>
    <div class="r"><span>${t("theme")}</span><button class="pill ic" id="p-theme" type="button" aria-label="${t("theme")}">${icon("i-moon")}</button></div>
    <div class="r"><span>${state.lang === "bn" ? "ভাষা" : "Language"}</span><button class="pill" id="p-lang" type="button">${t("language")}</button></div>
    <p class="hint" style="margin:8px 0 0">${t("demoNote")}</p>`;
  const b = $("#p-in"); if (b) b.onclick = () => { AD.signIn(); toast(t("syncedAs", state.email)); };
  const o = $("#p-out"); if (o) o.onclick = AD.signOut;
  $("#p-prem").onchange = (e) => AD.setPremium(e.target.checked); $("#p-theme").onclick = AD.toggleTheme; $("#p-lang").onclick = () => AD.setLang(state.lang === "bn" ? "en" : "bn");
}
function renderResume() {
  const r = state.resume, el = $("#resume"), show = r && !resumeDismissed && !player.current && D.BY_ID.get(r.id);
  el.hidden = !show; if (!show) return;
  const s = D.BY_ID.get(r.id), v = s.videos.find((x) => x.id === r.vid) || s.videos[0];
  el.innerHTML = `${icon("mark")}<div class="kick">${t("welcome")}</div><p>${t("continueQ", `“${esc(AD.title(s))}”`)} <span class="hint">${AD.fmtTime(r.pos)} / ${AD.fmtTime(v.sec)}</span></p>
    <div class="acts"><button class="btn sm pri" id="r-go" type="button">${icon("i-play")} ${t("cont")}</button><button class="btn sm" id="r-no" type="button">${t("dismiss")}</button></div>`;
  $("#r-go").onclick = () => { player.play(s, v, r.pos); AD.go("#/jukebox"); }; $("#r-no").onclick = () => { resumeDismissed = true; renderResume(); };
}
function renderBar() {
  const c = player.current, bar = $("#bar"); bar.hidden = !c; if (!c) return;
  const s = c.song, v = c.video, singers = (v.singers || []).map((x) => nameOf("singer", x));
  bar.innerHTML = `<div class="prog"><i id="bar-i"></i></div><img class="th" src="${AD.thumb(v, "mqdefault")}" alt="">
    <a class="meta" href="#/jukebox"><b>${esc(AD.title(s))}</b><span>${singers.length ? esc(singers.join(", ")) : esc(v.ch)}${player.upNext ? ` · ${t("upNext")}: ${esc(AD.title(player.upNext.song))}` : ""}</span></a>
    <div class="mid"><span class="time" id="bar-t"></span></div>
    <a class="btn sm ic yt" href="${AD.ytWatch(v)}" target="_blank" rel="noopener" title="${t("openYt")}" aria-label="${t("openYt")}">${icon("i-yt")}</a>
    <div class="ctl"><button type="button" id="b-like" class="likeb ${AD.isLiked(s.id) ? "on" : ""}" aria-pressed="${AD.isLiked(s.id)}" aria-label="${t("like")}">${icon(AD.isLiked(s.id) ? "i-heart-f" : "i-heart")}</button>
      <button type="button" id="b-pp" class="pp" aria-label="${player.playing ? t("pause") : t("play")}">${icon(player.playing ? "i-pause" : "i-play")}</button>
      <button type="button" id="b-next" aria-label="${t("next")}">${icon("i-next")}</button></div>`;
  $("#b-like").onclick = player.likeCurrent; $("#b-pp").onclick = player.toggle; $("#b-next").onclick = player.next; renderProgress();
}
function renderProgress() {
  const c = player.current; if (!c) return;
  const pct = Math.min(100, (player.pos / c.video.sec) * 100) + "%";
  const bi = $("#bar-i"); if (bi) bi.style.width = pct; $("#seek-i").style.width = pct;
  const bt = $("#bar-t"); if (bt) bt.textContent = `${AD.fmtTime(player.pos)} / ${AD.fmtTime(c.video.sec)}`;
  $("#seek-a").textContent = AD.fmtTime(player.pos); $("#seek-b").textContent = AD.fmtTime(c.video.sec);
}

/* ---- lists ---- */
function row(s) {
  const sg = AD.singersOf(s).map((x) => nameOf("singer", x)), meta = sg.length ? sg.slice(0, 2).join(", ") : [nameOf("parjay", s.parjay), nameOf("raag", s.raag)].filter(Boolean).join(" · ");
  return `<li class="${AD.hasRec(s) ? "" : "nr"}"><a href="${songHref(s)}"><span class="t">${esc(AD.title(s))}</span><span class="m">${AD.hasRec(s) ? `<b>▶ ${num(s.videos.length)}</b>` : ""}<span>${esc(meta)}</span></span>${AD.title2(s) ? `<span class="t2">${esc(AD.title2(s))}</span>` : ""}</a></li>`;
}
function songList(list, { limit = 60, toggle = true, recFirst = true } = {}) {
  const wrap = document.createElement("div"); let shown = limit, recOnly = false;
  const draw = () => {
    const rec = list.filter(AD.hasRec), rest = list.filter((s) => !AD.hasRec(s)), all = recOnly ? rec : recFirst ? rec.concat(rest) : list, vis = all.slice(0, shown);
    const firstRest = recFirst ? vis.findIndex((s) => !AD.hasRec(s)) : -1;
    wrap.innerHTML = (toggle ? `<div class="list-tools"><label class="tog"><input type="checkbox" class="ro"${recOnly ? " checked" : ""}> ${t("recOnly", rec.length, list.length)}</label></div>` : "")
      + `<ul class="rows">${vis.map((s, i) => (i === firstRest && i > 0 ? `<li class="div lab">${t("noRec")}</li>` : "") + row(s)).join("") || `<li class="div lab">${t("noRec")}</li>`}</ul>`

}
function renderFilters() {
  const F = player.F, pills = (key, values, kind) => `<div class="chips">${values.map((v) => { const n = player.countWith(key, v), onn = Array.isArray(F[key]) ? F[key].includes(v) : F[key] === v; return `<button type="button" class="chip" data-fk="${key}" data-fv="${esc(v)}" aria-pressed="${onn}"${n || onn ? "" : " disabled"}>${esc(nameOf(kind, v))} <small>${num(n)}</small></button>`; }).join("")}</div>`;
  const withRec = D.SONGS.filter(AD.hasRec), raags = [...new Set(withRec.map((s) => s.raag).filter(Boolean))].sort(), singers = [...new Set(withRec.flatMap(AD.singersOf))].sort();
  const top = (names, q, key) => AD.findNames(names, q).filter((v) => player.countWith(key, v) || F[key] === v).slice(0, q ? 20 : 10);
  const find = (id, val, label) => `<div class="find"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="${id}" type="search" value="${esc(val)}" placeholder="${t("typeFind")}" aria-label="${label}"></div>`;
  $("#filters").innerHTML = `<fieldset><legend class="lab">${t("mood")}</legend>${pills("moods", Object.keys(D.META.moods), "mood")}</fieldset><fieldset><legend class="lab">${t("season")}</legend>${pills("seasons", AD.SEASON_ORDER, "season")}</fieldset>
    <fieldset><legend class="lab">${t("parjay")}</legend>${pills("parjays", AD.groupsOf("parjay").map(([v]) => v), "parjay")}</fieldset>
    <fieldset><legend class="lab">${t("raag")}</legend>${find("fr", findRaag, t("raag"))}${pills("raag", top(raags, findRaag, "raag"), "raag")}</fieldset>
    <fieldset><legend class="lab">${t("singer")}</legend>${find("fs", findSinger, t("singer"))}${pills("singer", top(singers, findSinger, "singer"), "singer")}<label class="tog" style="margin-top:10px"><input type="checkbox" id="fl"${F.likedOnly ? " checked" : ""}> ${t("likedOnly")}</label></fieldset>`;
  $$("#filters [data-fk]").forEach((b) => b.onclick = () => player.toggleFilter(b.dataset.fk, b.dataset.fv));
  $("#fr").oninput = (e) => { findRaag = e.target.value; renderFilters(); $("#fr").focus(); $("#fr").setSelectionRange(99, 99); };
  $("#fs").oninput = (e) => { findSinger = e.target.value; renderFilters(); $("#fs").focus(); $("#fs").setSelectionRange(99, 99); };
  $("#fl").onchange = () => player.toggleFilter("likedOnly");
}
function renderQueue() {
  const list = player.queue(), pl = player.playlist;
  $("#qh").textContent = pl ? `${t("yourPlaylist")}: ${pl.label || ""}` : t("inSelection");
  $("#qn").textContent = pl ? `${num(Math.min(pl.idx + 1, list.length))} / ${num(list.length)} · ${t("thenMore")}` : t("songsCount", list.length);
  const shown = player.queueAll ? list : list.slice(0, 25);
  $("#queue").innerHTML = shown.map((s, i) => { const sg = AD.singersOf(s).map((x) => nameOf("singer", x)), isNow = s === player.current?.song, isNext = s === player.upNext?.song;
    return `<li class="${isNow ? "now" : ""}"><span class="num">${num(i + 1)}</span><button class="btn ic sm" type="button" data-pid="${esc(s.id)}" aria-label="${t("play")} ${esc(AD.title(s))}">${icon("i-play")}</button>
      <div style="min-width:0"><a class="t" href="${songHref(s)}">${esc(AD.title(s))}${AD.isLiked(s.id) ? ` <span class="lk">♥</span>` : ""}${isNow ? `<span class="tag">${t("nowPlaying")}</span>` : isNext ? `<span class="tag">${t("upNext")}</span>` : ""}</a><span class="s">${sg.length ? sg.map((x) => x === nameOf("singer", player.F.singer) ? `<b>${esc(x)}</b>` : esc(x)).join(", ") : t("unknownSinger")}</span></div>
      <div class="ex"><a class="btn ic sm" href="${AD.askAiUrl(s)}" target="_blank" rel="noopener" title="${t("askAi")}" aria-label="${t("askAi")}">${icon("i-spark")}</a><a class="btn ic sm" href="${AD.ytWatch(s.videos[0])}" target="_blank" rel="noopener" title="${t("openYt")}" aria-label="${t("openYt")}">${icon("i-yt")}</a></div></li>`; }).join("") || `<li class="hint" style="display:block;padding:10px 4px">${t("noPool")}</li>`;
  $$("#queue [data-pid]").forEach((b) => b.onclick = () => player.play(D.BY_ID.get(b.dataset.pid)));
  const qm = $("#qmore"); qm.hidden = list.length <= 25; qm.textContent = player.queueAll ? t("showFewer") : t("showAll", list.length); qm.onclick = () => { player.queueAll = !player.queueAll; renderQueue(); };
}

/* ---- mine ---- */
function renderMine() {
  const view = $("#view"), likes = state.likes.map((id) => D.BY_ID.get(id)).filter(Boolean), never = state.never.map((id) => D.BY_ID.get(id)).filter(Boolean), recent = state.recent.slice().reverse().slice(0, 12).map((id) => D.BY_ID.get(id)).filter(Boolean);
  view.innerHTML = `<div class="list-h" style="margin-top:22px"><h1>${t("mineH")}</h1></div>
    <div class="card acct"><span class="avatar ${state.signedIn ? "in" : ""}" aria-hidden="true">${state.signedIn ? "Y" : "S"}</span><div><p><b>${state.signedIn ? esc(state.email) : t("notSigned")}</b></p><p class="hint">${state.signedIn ? t("syncedAs", state.email) : t("localOnly")}</p></div>${state.signedIn ? `<button class="btn sm" id="m-out" type="button">${t("signOut")}</button>` : `<button class="btn" id="m-in" type="button">${icon("i-g")} ${t("signIn")}</button>`}</div>
    <section class="sec"><div class="sec-h"><h2>${t("likedSongs")}</h2><span class="hint">${t("songsCount", likes.length)}</span>${likes.some(AD.hasRec) ? `<button class="btn sm more" id="m-play" type="button">${icon("i-play")} ${t("playAll")}</button>` : ""}</div><div id="m-likes"></div></section>
    <section class="sec"><div class="sec-h"><h2>${t("recentH")}</h2></div><div id="m-recent"></div></section>
    <section class="sec"><div class="sec-h"><h2>${t("hiddenSongs")}</h2><span class="hint">${t("songsCount", never.length)}</span></div><ul class="rows">${never.map((s) => `<li><a href="${songHref(s)}"><span class="t">${esc(AD.title(s))}</span><span class="m"><button class="btn sm" type="button" data-un="${esc(s.id)}">${t("remove")}</button></span></a></li>`).join("") || `<li class="div hint">${t("none")}</li>`}</ul></section>`;
  if (likes.length) $("#m-likes").append(songList(likes, { toggle: false })); else $("#m-likes").innerHTML = `<div class="card empty"><b>${t("noneLiked")}</b><p>${t("noneLikedHint")}</p></div>`;
  if (recent.length) $("#m-recent").append(songList(recent, { toggle: false, recFirst: false })); else $("#m-recent").innerHTML = `<p class="hint">${t("none")}</p>`;
  const mi = $("#m-in"); if (mi) mi.onclick = () => { AD.signIn(); renderMine(); }; const mo = $("#m-out"); if (mo) mo.onclick = () => { AD.signOut(); renderMine(); };
  const mp = $("#m-play"); if (mp) mp.onclick = () => { player.setFilters({ likedOnly: true }); player.start(); AD.go("#/jukebox"); };
  $$("[data-un]", view).forEach((b) => b.onclick = (e) => { e.preventDefault(); AD.toggleList("never", b.dataset.un, false); renderMine(); });
}

/* ---- router ---- */
function route() {
  cur = AD.parseHash(); const p = cur.page, parts = cur.parts;
  document.body.dataset.page = p; $("#jukebox").hidden = p !== "jukebox"; $("#view").hidden = p === "jukebox";
  if (p !== "jukebox" && p !== "song" && !(p === "list" && parts[1] === "season")) setSeason(AD.currentSeason());
  renderNav(); renderResume(); renderBar();
  if (p === "jukebox") { renderJukebox(); window.scrollTo(0, 0); return; }
  if (p === "song") renderSong(parts[1]); else if (p === "browse") renderBrowse(parts[1]);
  else if (p === "list" && parts[1] === "parjay") renderList("parjay", parts[2], parts[3] || ""); else if (p === "list") renderList(parts[1], parts.slice(2).join("/"));
  else if (p === "mine") renderMine(); else renderHome();
  window.scrollTo(0, 0); if (p !== "home") $("#view").focus({ preventScroll: true });
}
AD.load().then((d) => {
  D = d;
  $("#lang").onclick = () => AD.setLang(state.lang === "bn" ? "en" : "bn"); $("#theme").onclick = AD.toggleTheme;
  $("#acct").onclick = (e) => { e.stopPropagation(); const p = $("#pop"); p.hidden = !p.hidden; $("#acct").setAttribute("aria-expanded", String(!p.hidden)); if (!p.hidden) renderPop(); };
  document.addEventListener("click", (e) => { if (!$("#pop").hidden && !e.target.closest("#pop")) { $("#pop").hidden = true; $("#acct").setAttribute("aria-expanded", "false"); } });
  on("lang", () => { renderPop(); route(); }); on("account", () => { renderNav(); if (!$("#pop").hidden) renderPop(); });
  on("player", () => { renderBar(); renderResume(); if (cur.page === "jukebox") renderJukebox(); }); on("progress", renderProgress);
  on("filters", () => { if (cur.page === "jukebox") { renderFilterBar(); renderQueue(); } }); on("prefs", () => { renderBar(); if (cur.page === "jukebox") renderJukebox(); });
  window.addEventListener("hashchange", route); route();
});
})();
</script>
</body>

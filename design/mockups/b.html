<!doctype html>
<html lang="bn" data-concept="b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আনন্দধারা · B — ঋতুরঙ্গ Riturango</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<style>
/* ===== B · ঋতুরঙ্গ — the six seasons of the Bengali year colour the whole site.
   One accent, one sky, one scene per ritu; soft cards; bottom tabs on the phone. ===== */
:root{
  --bg:#f7f3ec; --card:#ffffff; --card2:#f1ece2; --ink:#1f1b17; --ink2:#5c554c; --ink3:#8b8378; --line:rgba(31,27,23,.1); --line2:rgba(31,27,23,.2);
  --acc:#3e5a73; --acc-ink:#fff; --acc-soft:#e3eaf1; --sky1:#8aa9c3; --sky2:#dfe8ef; --ground:#4f7a5a; --fg-hero:#102030;
  --shadow:0 10px 30px rgba(40,30,10,.1); --r:16px; --tabs:60px; --mini:64px;
  --serif:"Noto Serif Bengali","Tiro Bangla",serif; --sans:"Hind Siliguri",system-ui,sans-serif; --en:"Fraunces",Georgia,serif; color-scheme:light;
}
/* season palettes (light) */
[data-season=Grishma]{--acc:#b7401f;--acc-soft:#f6e1d7;--sky1:#f3c56b;--sky2:#fbe9c4;--ground:#c9803f;--fg-hero:#3a1d08}
[data-season=Barsha]{--acc:#2f5570;--acc-soft:#dfe8ef;--sky1:#6e8ba3;--sky2:#c7d4de;--ground:#3f6e4f;--fg-hero:#0f2130}
[data-season=Sharat]{--acc:#2c73a8;--acc-soft:#dcebf7;--sky1:#6fb0e0;--sky2:#e9f3fb;--ground:#e9e4d2;--fg-hero:#0d2a44}
[data-season=Hemanta]{--acc:#9a6a12;--acc-soft:#f4e8cd;--sky1:#dcc9a0;--sky2:#f3ebdc;--ground:#d4a63a;--fg-hero:#35260a}
[data-season=Sheet]{--acc:#8a5a1e;--acc-soft:#f1e6d6;--sky1:#c6ced3;--sky2:#edf0f1;--ground:#e2c044;--fg-hero:#2b2a28}
[data-season=Basanta]{--acc:#c43f2a;--acc-soft:#fbe0d9;--sky1:#f1a26b;--sky2:#fbe3d6;--ground:#7bb661;--fg-hero:#3b1208}
/* dark: the same seasons at night */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#15141a; --card:#1e1d24; --card2:#26252d; --ink:#efe9df; --ink2:#b4ada2; --ink3:#817a70; --line:rgba(239,233,223,.1); --line2:rgba(239,233,223,.22); --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
  --acc:#9ab6d0;--acc-ink:#101418;--acc-soft:#232b36;--sky1:#1d2a3a;--sky2:#2b3a4e;--fg-hero:#eef2f6}
  [data-season=Grishma]:not([data-theme=light]){--acc:#f0996d;--acc-soft:#3a241b;--sky1:#3a2114;--sky2:#5a3220;--ground:#7a4a24;--fg-hero:#fbeadb}
  [data-season=Barsha]:not([data-theme=light]){--acc:#9ab6d0;--acc-soft:#232b36;--sky1:#161f2b;--sky2:#2b3a4e;--ground:#243f30;--fg-hero:#e8eef4}
  [data-season=Sharat]:not([data-theme=light]){--acc:#8fc3ea;--acc-soft:#1f2d3b;--sky1:#0f1f33;--sky2:#2a4566;--ground:#6b6a5f;--fg-hero:#eef5fb}
  [data-season=Hemanta]:not([data-theme=light]){--acc:#e2b85c;--acc-soft:#33291a;--sky1:#241d12;--sky2:#4a3a1c;--ground:#8a6a22;--fg-hero:#f7efdc}
  [data-season=Sheet]:not([data-theme=light]){--acc:#d9a86a;--acc-soft:#2e2721;--sky1:#1a1d22;--sky2:#343a42;--ground:#8a7a2a;--fg-hero:#f1efe9}
  [data-season=Basanta]:not([data-theme=light]){--acc:#f08a6e;--acc-soft:#3a1f1a;--sky1:#2a1410;--sky2:#5a2a22;--ground:#3e6a36;--fg-hero:#fbe9e2}}
:root[data-theme=dark]{--bg:#15141a; --card:#1e1d24; --card2:#26252d; --ink:#efe9df; --ink2:#b4ada2; --ink3:#817a70; --line:rgba(239,233,223,.1); --line2:rgba(239,233,223,.22); --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
:root[data-theme=dark][data-season=Grishma]{--acc:#f0996d;--acc-ink:#101418;--acc-soft:#3a241b;--sky1:#3a2114;--sky2:#5a3220;--ground:#7a4a24;--fg-hero:#fbeadb}
:root[data-theme=dark][data-season=Barsha]{--acc:#9ab6d0;--acc-ink:#101418;--acc-soft:#232b36;--sky1:#161f2b;--sky2:#2b3a4e;--ground:#243f30;--fg-hero:#e8eef4}
:root[data-theme=dark][data-season=Sharat]{--acc:#8fc3ea;--acc-ink:#101418;--acc-soft:#1f2d3b;--sky1:#0f1f33;--sky2:#2a4566;--ground:#6b6a5f;--fg-hero:#eef5fb}
:root[data-theme=dark][data-season=Hemanta]{--acc:#e2b85c;--acc-ink:#101418;--acc-soft:#33291a;--sky1:#241d12;--sky2:#4a3a1c;--ground:#8a6a22;--fg-hero:#f7efdc}
:root[data-theme=dark][data-season=Sheet]{--acc:#d9a86a;--acc-ink:#101418;--acc-soft:#2e2721;--sky1:#1a1d22;--sky2:#343a42;--ground:#8a7a2a;--fg-hero:#f1efe9}
:root[data-theme=dark][data-season=Basanta]{--acc:#f08a6e;--acc-ink:#101418;--acc-soft:#3a1f1a;--sky1:#2a1410;--sky2:#5a2a22;--ground:#3e6a36;--fg-hero:#fbe9e2}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;overflow-x:hidden;padding-bottom:calc(var(--tabs) + var(--mini) + 28px + env(safe-area-inset-bottom));transition:background .4s}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
#view:focus,#view:focus-visible{outline:none}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;line-height:1.25;text-wrap:balance}
.en{font-family:var(--en)}
.hint{color:var(--ink3);font-size:.86rem}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--serif);font-weight:700;font-size:1.35rem;line-height:1}
.brand:hover{text-decoration:none}
.brand .dot{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sky2),var(--acc));box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line2)}
.brand small{display:none;font-family:var(--en);font-weight:400;font-size:.8rem;color:var(--ink3);font-style:italic}
.spacer{flex:1}
.topnav{display:none;gap:4px;margin-left:24px}
.topnav a{padding:8px 14px;border-radius:999px;color:var(--ink2);font-weight:600}
.topnav a:hover{text-decoration:none;color:var(--ink)}
.topnav a[aria-current=page]{background:var(--acc-soft);color:var(--acc)}
.pill{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;gap:6px;background:var(--card)}
.pill:hover{border-color:var(--acc);color:var(--acc)}
.pill.ic{width:36px;padding:0;justify-content:center}
.pill svg{width:18px;height:18px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:700;display:grid;place-items:center;position:relative}
.avatar.in::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#3b9b5a;border:2px solid var(--card)}
@media (min-width:900px){.topnav{display:flex}.brand small{display:inline}.top .wrap{height:66px}body{padding-bottom:calc(var(--mini) + 40px)}}
/* bottom tabs (phone) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabs) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--card);border-top:1px solid var(--line)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink3);font-size:.76rem;font-weight:600}
.tabs a:hover{text-decoration:none}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current=page]{color:var(--acc)}
@media (min-width:900px){.tabs{display:none}}

/* ---- hero: the season's sky ---- */
.hero{position:relative;margin:16px 0 0;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--fg-hero);box-shadow:var(--shadow);min-height:260px;display:grid;align-items:end}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:22px 20px 20px;display:grid;gap:6px}
.hero .date{font-family:var(--serif);font-size:1rem;opacity:.9}
.hero .date .en{opacity:.8;font-style:italic;margin-left:8px;font-size:.92rem}
.hero h1{font-size:clamp(2.4rem,9vw,4rem);font-weight:700;line-height:1.05}
.hero h1 small{display:block;font-family:var(--en);font-weight:400;font-style:italic;font-size:1.05rem;opacity:.85;margin-top:4px}
.hero p{margin:0;max-width:46ch;opacity:.92}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:center}
.hero .acts .hint{color:inherit;opacity:.8}
@media (min-width:900px){.hero{min-height:340px}.hero .in{padding:32px 36px 30px}}
.seasons{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:4px 16px}
.seasons::-webkit-scrollbar{display:none}
.seasons button{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:8px}
.seasons button i{width:12px;height:12px;border-radius:50%;background:var(--sw)}
.seasons button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seasons button.on i{box-shadow:0 0 0 2px var(--acc-ink)}

/* ---- buttons / chips ---- */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:700;white-space:nowrap;transition:transform .15s,box-shadow .2s}
.btn:hover{text-decoration:none;transform:translateY(-1px);box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);box-shadow:none}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.sm{height:36px;padding:0 14px;font-size:.88rem}
.btn.ic{width:44px;padding:0;justify-content:center}
.btn.ic.sm{width:36px}
.btn[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);font-size:.86rem;font-weight:600}
.chip:hover{text-decoration:none;border-color:var(--acc);color:var(--acc)}
.chip[aria-pressed=true],.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip small{opacity:.7;font-variant-numeric:tabular-nums}
.chip:disabled{opacity:.4;cursor:default}
.chip.x::after{content:"×";opacity:.7}

/* ---- sections / cards ---- */
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:1.45rem}
.sec-h .more{margin-left:auto;font-weight:600;font-size:.9rem}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);margin-top:16px}
.search:focus-within{box-shadow:0 0 0 3px var(--acc-soft),var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1.02rem;color:var(--ink);outline:none}
.search svg{width:20px;height:20px;color:var(--ink3);flex:none}

/* feelings */
.feel h2{font-size:1.6rem}
.feel textarea{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:72px;margin-top:10px}
.feel textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.feel textarea::placeholder{color:var(--ink3)}
.feel-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
.feel-row .go{margin-left:auto}
.feel-n{display:flex;gap:4px;align-items:center}
.feel-n input{width:4rem;font:inherit;padding:6px 10px;border:1px solid var(--line2);border-radius:999px;background:var(--bg);color:var(--ink)}
.feel-out{margin-top:14px;display:grid;gap:10px}
.feel-out p{margin:0}

/* mood colour fields */
.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.moods{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.moods{grid-template-columns:repeat(4,1fr)}}
.mood{position:relative;overflow:hidden;min-height:112px;border-radius:var(--r);padding:14px;text-align:left;color:#fff;background:linear-gradient(150deg,var(--m1),var(--m2));display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .2s}
.mood:hover{transform:translateY(-2px)}
.mood::after{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)}
.mood b{font-family:var(--serif);font-size:1.4rem;font-weight:700;line-height:1.1}
.mood small{font-size:.76rem;opacity:.92;line-height:1.3}
.mood .n{font-size:.8rem;font-weight:700;opacity:.95}
.mood:disabled{opacity:.5;cursor:default;transform:none}

/* song rows & cards */
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--line)}
.rows a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 14px;padding:10px 4px;color:var(--ink);border-radius:8px}
.rows a:hover{background:var(--card2);text-decoration:none}
.rows .t{font-family:var(--serif);font-size:1.08rem;line-height:1.35}
.rows .t2{color:var(--ink3);font-size:.82rem}
.rows .m{grid-row:1/span 2;grid-column:2;align-self:center;text-align:right;font-size:.8rem;color:var(--ink3);white-space:nowrap;display:grid;justify-items:end;gap:2px}
.rows .m b{color:var(--acc);font-weight:700}
.rows li.nr .t{color:var(--ink2)}
.rows .div{padding:14px 4px 4px;color:var(--ink3);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.list-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:.86rem;color:var(--ink2);cursor:pointer}
.more-row{margin-top:12px}
.row{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:6px 16px 16px;scroll-snap-type:x proximity;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.scard{flex:0 0 200px;scroll-snap-align:start;text-align:left;color:var(--ink);display:block}
.scard:hover{text-decoration:none}
.scard .th{aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--card2);box-shadow:var(--shadow);position:relative}
.scard .th img{width:100%;height:100%;object-fit:cover;display:block}
.scard .th .pl{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.scard .th .pl svg{width:20px;height:20px}
.scard b{display:block;margin-top:8px;font-family:var(--serif);font-weight:600;font-size:1rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard span{display:block;color:var(--ink3);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){.row{margin:0;padding:6px 0 16px}.scard{flex-basis:220px}}

/* browse */
.kinds{margin-top:14px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.group{background:var(--card);border-radius:14px;padding:12px 14px;color:var(--ink);box-shadow:var(--shadow);display:grid;gap:4px}
.group:hover{text-decoration:none;outline:2px solid var(--acc)}
.group b{font-family:var(--serif);font-weight:600;font-size:1.05rem;line-height:1.3}
.group small{color:var(--ink3);font-size:.78rem}
.group .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.group .bar i{display:block;height:100%;background:var(--acc)}
.group .n{font-size:.8rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.find{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--card);max-width:420px;margin-top:14px}
.find input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:none}
.find svg{width:16px;height:16px;color:var(--ink3)}
.crumb{color:var(--ink3);font-size:.86rem;margin:16px 0 4px}
.list-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 12px}
.list-h h1{font-size:2rem}
.list-h .n{color:var(--ink3)}

/* song page */
.shero{margin-top:16px;border-radius:22px;background:linear-gradient(160deg,var(--sky1),var(--sky2));color:var(--fg-hero);padding:22px 20px;position:relative;overflow:hidden}
.shero svg.scene{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.shero .in{position:relative}
.shero .kick{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.shero h1{font-size:clamp(1.7rem,5.5vw,2.6rem);font-weight:700;margin-top:4px}
.shero .t2{font-family:var(--en);font-style:italic;opacity:.85;margin:4px 0 0;font-size:1.05rem}
.shero .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.shero .btn.ghost{background:rgba(255,255,255,.6);border-color:transparent;color:#1b1b1b}
:root[data-theme=dark] .shero .btn.ghost{background:rgba(0,0,0,.35);color:#fff}
@media (min-width:900px){.shero{padding:30px 36px}}
.song{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:18px}
@media (min-width:900px){.song{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:start}}
.lyrics{white-space:pre-wrap;font-family:var(--serif);font-size:1.15rem;line-height:1.95;margin:0;max-width:62ch}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.ledger>div{background:var(--card);padding:12px 14px}
.ledger dt{font-size:.7rem;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.ledger dd{margin:4px 0 0;font-weight:500}
.ledger dd .sub{display:block;color:var(--ink3);font-size:.82rem;font-weight:400}
.ledger .span{grid-column:1/-1}
.src{font-size:.84rem;color:var(--ink3);margin-top:14px}
.vids{display:grid;gap:12px;margin-top:12px}
.vid{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.vid .fr{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.vid .fr img{width:100%;height:100%;object-fit:cover;display:block}
.vid .fr button{position:absolute;inset:0;display:grid;place-items:center}
.vid .fr button span{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.vid .fr button span svg{width:18px;height:18px}
.vid figcaption{font-size:.9rem;line-height:1.35;min-width:0}
.vid figcaption .s{font-family:var(--serif);font-weight:600;font-size:1rem}
.vid figcaption small{display:block;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid .yt{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;margin-top:3px}
.vid .yt svg{width:14px;height:14px}

/* jukebox */
.jb{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:900px){.jb{grid-template-columns:minmax(0,1.25fr) minmax(360px,.9fr);gap:36px;align-items:start}.jb .side{position:sticky;top:84px}}
.stage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0c1118;box-shadow:var(--shadow)}
.stage iframe,.stage img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.stage .empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:16px;color:#eef;background:linear-gradient(160deg,var(--sky1),var(--sky2));color:var(--fg-hero)}
.stage .empty p{margin:0;max-width:34ch;font-family:var(--serif);font-size:1.05rem}
.stage .paused{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45)}
.stage .paused button{width:76px;height:76px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center}
.stage .paused button svg{width:32px;height:32px}
.now{margin-top:16px}
.now .kick{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.now h2{font-size:clamp(1.6rem,6vw,2.3rem);font-weight:700;line-height:1.2}
.now h2 a{color:var(--ink)}
.now .t2{font-family:var(--en);font-style:italic;color:var(--ink2);margin:2px 0 6px}
.now .meta{color:var(--ink2);font-size:.92rem;margin:0 0 6px}
.now .meta b{color:var(--ink)}
.seek{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--ink3);font-variant-numeric:tabular-nums;margin:16px 0 8px}
.seek .trk{flex:1;height:4px;border-radius:2px;background:var(--line2);position:relative}
.seek .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--acc);width:0}
.seek .trk i::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--card)}
.ctls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.ctls .rnd{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.ctls .rnd:hover{color:var(--acc)}
.ctls .rnd.on{color:#c4382a}
.ctls .rnd svg{width:24px;height:24px}
.ctls .big{width:68px;height:68px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 0 0 8px var(--acc-soft)}
.ctls .big svg{width:32px;height:32px}
.ctls .rnd:disabled,.ctls .big:disabled{opacity:.4}
.jacts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.next{margin:10px 0 0;color:var(--ink2);font-size:.9rem;text-align:center}
.jl{margin-top:14px;max-height:15rem;overflow:auto;border-top:1px solid var(--line);padding-top:10px}
.jl .lyrics{font-size:1rem;line-height:1.8}
.fbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.fbar .cnt{font-weight:700;font-variant-numeric:tabular-nums}
.fbar .act{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px}
.queue{list-style:none;margin:10px 0 0;padding:0}
.queue li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px}
.queue li.now{background:var(--acc-soft)}
.queue .th{width:72px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;background:var(--card2);position:relative;display:block}
.queue .thw{position:relative;width:72px}
.queue .thw button{position:absolute;inset:0;display:grid;place-items:center;color:#fff;border-radius:8px;background:rgba(0,0,0,.25)}
.queue .thw button svg{width:22px;height:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.queue .t{font-family:var(--serif);font-weight:600;font-size:1rem;color:var(--ink);display:block;line-height:1.3}
.queue .s{display:block;font-size:.8rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue .s b{color:var(--ink);font-weight:600}
.queue .tag{display:inline-block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-left:6px;font-weight:700}
.queue .lk{color:#c4382a}
.queue .ex{display:flex;gap:4px}
.queue .ex .btn.ghost{box-shadow:none}
/* filter sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:84dvh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));z-index:41;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 14px}
.sheet h3{font-size:1.3rem;display:flex;justify-content:space-between;align-items:center}
.sheet .grp{margin-top:16px}
.sheet .grp h4{margin:0 0 8px;font-size:.72rem;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.sheet .find{margin:0 0 8px;height:36px}
@media (min-width:900px){.sheet{left:auto;right:40px;bottom:100px;width:560px;border-radius:22px;max-height:70vh}}

/* mine */
.acct{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:14px 0 18px}
.acct .avatar{width:46px;height:46px;font-size:1.1rem}
.acct p{margin:0}
.acct .btn{grid-column:1/-1;justify-self:start}
@media (min-width:600px){.acct{grid-template-columns:auto 1fr auto}.acct .btn{grid-column:auto}}
.empty{text-align:center;color:var(--ink2);padding:28px 18px}
.empty b{display:block;font-family:var(--serif);font-size:1.3rem;color:var(--ink)}
.empty p{margin:6px auto 0;max-width:36ch}

/* ---- persistent player: a floating pill on the phone, a bar on desktop ---- */
.mini{position:fixed;left:12px;right:12px;bottom:calc(var(--tabs) + 10px + env(safe-area-inset-bottom));z-index:31;height:var(--mini);border-radius:18px;background:var(--card);box-shadow:0 12px 36px rgba(0,0,0,.22);display:flex;align-items:center;gap:10px;padding:0 8px 0 8px;overflow:hidden}
.mini .prog{position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--line)}
.mini .prog i{display:block;height:100%;background:var(--acc);width:0;border-radius:inherit}
.mini .th{width:64px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:#000}
.mini .meta{flex:1;min-width:0;color:var(--ink)}
.mini .meta:hover{text-decoration:none}
.mini .meta b{display:block;font-family:var(--serif);font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.mini .meta span{display:block;font-size:.76rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .time{display:none;font-size:.74rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.mini .ctl{display:flex;gap:0;flex:none}
.mini .ctl button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.mini .ctl button:hover{background:var(--card2)}
.mini .ctl button.on{color:#c4382a}
.mini .ctl .pp{background:var(--acc);color:var(--acc-ink)}
.mini .ctl svg{width:22px;height:22px}
.mini .yt{display:none}
.mini .likeb{display:none}
@media (min-width:900px){.mini{left:0;right:0;bottom:0;border-radius:0;height:76px;padding:0 32px;gap:18px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px)}.mini .prog{left:0;right:0;border-radius:0}.mini .time,.mini .yt,.mini .likeb{display:inline-flex}.mini .ctl{gap:8px}.mini .meta{flex:0 1 420px}.mini .mid{flex:1;display:flex;justify-content:center}}
body[data-page=jukebox] .mini{display:none}

/* welcome back */
.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + var(--mini) + 22px + env(safe-area-inset-bottom));z-index:32;width:min(520px,calc(100% - 24px));background:var(--card);border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.25);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;border-left:6px solid var(--acc)}
.resume .sun{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sky2),var(--acc));grid-row:1/span 2}
.resume .kick{font-weight:700;color:var(--acc);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.resume p{margin:0;font-family:var(--serif);font-size:1rem}
.resume .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
@media (min-width:900px){.resume{bottom:calc(var(--mini) + 20px)}}
body[data-page=jukebox] .resume{bottom:calc(var(--tabs) + 16px)}
/* account popover */
.pop{position:fixed;right:12px;top:66px;z-index:35;width:min(330px,calc(100% - 24px));background:var(--card);border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.25);padding:16px}
.pop h3{font-size:1.15rem;margin-bottom:8px}
.pop .r{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.pop .r:first-of-type{border-top:0}
.pop .r small{display:block;color:var(--ink3);font-size:.78rem}
.pop .r label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1}
.pop .r input{margin-top:4px}
.pop .btn{width:100%;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(var(--tabs) + var(--mini) + 26px);transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.86rem;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{margin-top:40px;padding:20px 0 10px;border-top:1px solid var(--line);color:var(--ink3);font-size:.84rem}
.loading{padding:60px 0;text-align:center;color:var(--ink3)}
@keyframes rain{to{transform:translateY(40px)}}
.scene .rain{animation:rain 1.1s linear infinite}
.scene .rain:nth-child(2){animation-delay:-.4s}
@keyframes drift{to{transform:translateX(30px)}}
.scene .cloud{animation:drift 14s ease-in-out infinite alternate}
</style>
</head>

<script>
(() => {
const { $, $$, esc, enc, state, t, num, nameOf, moodDesc, player, on } = AD;
let D = null, cur = { page: "home", parts: [] }, resumeDismissed = false, previewSeason = null;
const icon = (id) => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const toast = (m) => { const el = $("#toast"); el.textContent = m; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 1800); };
const songHref = (s) => `#/song/${enc(s.id)}`;
const seasonName = (k) => state.lang === "bn" ? AD.SEASONS[k].bn : k;
const SW = { Grishma: "#e9b44c", Barsha: "#3e5a73", Sharat: "#6aa5cf", Hemanta: "#d4a63a", Sheet: "#e2c044", Basanta: "#e3552b" };
const MOODC = { prem: ["#c94a6f", "#8a2a4a"], viraha: ["#4b4f8c", "#2b2d5a"], bishad: ["#5a6472", "#343b45"], ananda: ["#e59a2a", "#b85e12"], shanti: ["#5f8f72", "#3b6250"], bhakti: ["#c4772a", "#8a4a12"], "prakriti-bhava": ["#3f8a5a", "#235a3a"], utsav: ["#c43a8a", "#7a1f5a"], deshprem: ["#b4432a", "#7a2a1a"], sahas: ["#b3222a", "#6e1016"], smriti: ["#8c6a4a", "#5a4230"], kautuk: ["#2a9aa8", "#166a76"] };
const setSeason = (k) => { document.documentElement.dataset.season = k; };
const curSeason = () => previewSeason || AD.currentSeason();

/* ---- season scenes (SVG, drawn in code) ---- */
function scene(k, w = 800, h = 340) {
  const rnd = (seed) => { let x = seed * 9301 + 49297; return () => { x = (x * 9301 + 49297) % 233280; return x / 233280; }; };
  const r = rnd(k.length * 7), parts = [];
  const o = `<svg class="scene" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMax slice" aria-hidden="true">`;
  if (k === "Grishma") {
    parts.push(`<circle cx="${w * .78}" cy="${h * .32}" r="58" fill="#fff3c4" opacity=".95"/><circle cx="${w * .78}" cy="${h * .32}" r="92" fill="#fff3c4" opacity=".25"/>`);
    for (let i = 0; i < 6; i++) parts.push(`<path d="M0 ${h * .62 + i * 14} q ${w / 4} -8 ${w / 2} 0 t ${w / 2} 0" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>`);
    for (let i = 0; i < 40; i++) parts.push(`<circle cx="${r() * w * .45}" cy="${h * .25 + r() * h * .3}" r="${2 + r() * 3}" fill="#c8401f" opacity=".85"/>`);
    parts.push(`<path d="M0 ${h * .3} q 60 -40 120 10 t 110 -20" fill="none" stroke="#5a3a18" stroke-width="3"/>`);
  } else if (k === "Barsha") {
    for (let i = 0; i < 3; i++) parts.push(`<ellipse class="cloud" cx="${w * (.2 + i * .3)}" cy="${h * .22 + i * 10}" rx="${120 + i * 20}" ry="34" fill="rgba(255,255,255,.22)"/>`);
    for (let g = 0; g < 2; g++) { let d = ""; for (let i = 0; i < 70; i++) { const x = r() * w, y = r() * h; d += `M${x} ${y}l-6 18`; } parts.push(`<path class="rain" d="${d}" stroke="rgba(255,255,255,.45)" stroke-width="1.2" fill="none"/>`); }
    for (let i = 0; i < 14; i++) parts.push(`<circle cx="${w * .1 + r() * w * .3}" cy="${h * .7 + r() * 40}" r="${5 + r() * 5}" fill="#e6b84a" opacity=".9"/>`);
    parts.push(`<path d="M0 ${h} L0 ${h * .82} Q ${w * .3} ${h * .7} ${w * .6} ${h * .84} T ${w} ${h * .8} L${w} ${h}z" fill="var(--ground)" opacity=".7"/>`);
  } else if (k === "Sharat") {

    for (let i = 0; i < 18; i++) parts.push(`<circle cx="${r() * w}" cy="${h * .55 + r() * h * .3}" r="3" fill="#fff"/><circle cx="${r() * w}" cy="${h * .55 + r() * h * .3}" r="1.6" fill="#e8832a"/>`);

    for (let i = 0; i < 160; i++) { const x = r() * w; parts.push(`<path d="M${x} ${h} q 4 -30 ${2 - r() * 6} -${50 + r() * 40}" fill="none" stroke="var(--ground)" stroke-width="2" stroke-linecap="round"/>`); }
    parts.push(`<circle cx="${w * .2}" cy="${h * .3}" r="40" fill="rgba(255,240,200,.7)"/>`);
  } else if (k === "Sheet") {

    for (let i = 0; i < 220; i++) parts.push(`<circle cx="${r() * w}" cy="${h * .66 + r() * h * .34}" r="${1.5 + r() * 2.5}" fill="#e2c044" opacity=".9"/>`);
    parts.push(`<path d="M${w * .1} ${h * .62} v -70 m -10 70 h 20" stroke="#5a3a18" stroke-width="3" fill="none"/><path d="M${w * .1} ${h * .5} l 24 -40 m -24 40 l -24 -40" stroke="#5a3a18" stroke-width="2" fill="none"/>`);
  } else {
    parts.push(`<path d="M0 ${h * .9} q ${w * .25} -120 ${w * .55} -40 t ${w * .45} -60" fill="none" stroke="#5a3a18" stroke-width="4"/>`);
    for (let i = 0; i < 46; i++) { const x = r() * w, y = h * .35 + r() * h * .5; parts.push(`<path d="M${x} ${y} q 6 -12 12 0 q -6 12 -12 0z" fill="#e3552b"/><path d="M${x} ${y} q -8 -10 -2 -16" stroke="#e3552b" stroke-width="2" fill="none"/>`); }
    for (let i = 0; i < 30; i++) parts.push(`<circle cx="${r() * w}" cy="${r() * h}" r="${6 + r() * 14}" fill="#d63a7a" opacity=".15"/>`);
  }

}

    <div class="list-h"><h1>${esc(sub ? nameOf("sub", sub) : nameOf(kind, value))}</h1><span class="n">${t("songsCount", list.length)}</span>${kind === "mood" ? `<span class="hint">${esc(moodDesc(value))}</span>` : ""}${playable ? `<button class="btn sm" id="pl" type="button">${icon("i-play")} ${t("play")}</button>` : ""}</div>
    ${kind === "season" ? `<div class="hero" style="min-height:140px;margin:0 0 16px">${scene(value, 800, 160)}</div>` : ""}
    ${subs.length > 1 ? `<div class="chips scroll" style="margin-bottom:12px"><a class="chip${sub ? "" : " on"}" href="#/list/parjay/${enc(value)}">${t("subAll")} <small>${num(all.length)}</small></a>${subs.map(([v, n]) => `<a class="chip${v === sub ? " on" : ""}" href="#/list/parjay/${enc(value)}/${enc(v)}">${esc(nameOf("sub", v))} <small>${num(n)}</small></a>`).join("")}</div>` : ""}
    <div id="body"></div>`;
  $("#body").append(songList(list));
  if (playable) $("#pl").onclick = () => { player.setFilter(kind, value); player.start(); AD.go("#/jukebox"); };
}

/* ---- song page ---- */
function renderSong(id) {
  const s = D.BY_ID.get(id), view = $("#view");
  if (!s) { view.innerHTML = `<p>Not found. <a href="#/">${t("home")}</a></p>`; return; }
  const k = s.season || curSeason(); setSeason(k);
  const chip = (kk, v) => `<a href="#/list/${kk}/${enc(v)}">${esc(nameOf(kk, v))}</a>`;
  const cells = [["parjay", s.parjay && chip("parjay", s.parjay) + (s.sub ? `<span class="sub"><a href="#/list/parjay/${enc(s.parjay)}/${enc(s.sub)}">${esc(nameOf("sub", s.sub))}</a></span>` : "")], ["season", s.season && chip("season", s.season)],
    ["raag", s.raag && chip("raag", s.raag) + (s.raagFull && s.raagFull !== s.raag ? `<span class="sub">${esc(s.raagFull)}</span>` : "")], ["taal", s.taal && chip("taal", s.taal)], ["written", s.written && esc(s.written)], ["drama", s.drama && s.drama.split(", ").map((d) => chip("drama", d)).join(", ")]].filter(([, v]) => v);
  const vids = s.videos == null ? `<p class="hint">${t("notYet")}</p>` : !s.videos.length ? `<p class="hint">${t("noMatch")}</p>` : `<div class="vids">${s.videos.map((v, i) => `<figure class="vid" style="margin:0"><div class="fr"><img src="${AD.thumb(v)}" alt="" loading="lazy"><button type="button" data-v="${i}" aria-label="${t("play")}: ${esc(v.t)}"><span>${icon("i-play")}</span></button></div>
      <figcaption><span class="s">${(v.singers || []).length ? esc(v.singers.map((x) => nameOf("singer", x)).join(", ")) : esc(v.ch)}</span><small>${esc(v.t)}</small><small>${AD.fmtViews(v.views)} ${t("views")} · ${AD.fmtTime(v.sec)}</small><a class="yt" href="${AD.ytWatch(v)}" target="_blank" rel="noopener">${icon("i-ext")} ${t("openYt")}</a></figcaption></figure>`).join("")}</div>`;
  view.innerHTML = `<section class="shero">${scene(k, 800, 220)}<div class="in"><div class="kick">${[nameOf("parjay", s.parjay), nameOf("sub", s.sub)].filter(Boolean).join(" · ")}</div><h1>${esc(AD.title(s))}</h1>${AD.title2(s) ? `<p class="t2">${esc(AD.title2(s))}</p>` : ""}
      <div class="acts">${AD.hasRec(s) ? `<button class="btn" type="button" id="s-play">${icon("i-play")} ${t("play")}</button>` : ""}<button class="btn ghost" id="s-like" type="button" aria-pressed="${AD.isLiked(s.id)}">${icon(AD.isLiked(s.id) ? "i-heart-f" : "i-heart")} ${AD.isLiked(s.id) ? t("liked") : t("like")}</button>
        <a class="btn ghost" href="${AD.askAiUrl(s)}" target="_blank" rel="noopener" title="${t("askAiT")}">${icon("i-spark")} ${t("askAi")}</a><button class="btn ghost" id="s-never" type="button" aria-pressed="${AD.isNever(s.id)}">${AD.isNever(s.id) ? t("nevered") : t("never")}</button></div></div></section>
    <article class="song">
      <div class="card">${s.lyrics ? `<pre class="lyrics">${esc(s.lyrics)}</pre>` : `<p class="hint">${t("lyricsNA")}</p>`}
        <p class="src">${s.source.includes("geetabitan") ? `${t("srcGb").replace("geetabitan.com", "")}<a href="${esc(s.source)}" target="_blank" rel="noopener">geetabitan.com</a>` : `${t("source")}: <a href="${esc(s.source)}" target="_blank" rel="noopener">${t("srcWs")}</a>`}</p></div>
      <aside><dl class="ledger" style="margin:0">${cells.map(([kk, v]) => `<div class="${kk === "drama" ? "span" : ""}"><dt>${t(kk)}</dt><dd>${v}</dd></div>`).join("")}${(s.moods || []).length ? `<div class="span"><dt>${t("mood")}</dt><dd><div class="chips" style="margin-top:4px">${s.moods.map((m) => `<a class="chip" href="#/list/mood/${enc(m)}" style="height:30px">${esc(nameOf("mood", m))}</a>`).join("")}</div></dd></div>` : ""}</dl>
        <div class="sec-h" style="margin-top:18px"><h2 style="font-size:1.2rem">${t("recordings")}</h2>${AD.hasRec(s) ? `<span class="hint">${t("recN", s.videos.length)}</span>` : ""}</div>${vids}</aside>
    </article>
    <section class="sec" aria-labelledby="h-rel"><div class="sec-h"><h2 id="h-rel">${t("moreLike")}</h2><span class="hint">${t("moreLikeHint")}</span>${(s.moods || []).length ? `<button class="btn sm soft more" id="pl" type="button">${icon("i-play")} ${t("playLike")}</button>` : ""}</div><div class="row" id="rel"></div></section>`;
  const rel = AD.relatedSongs(s, 10); $("#rel").innerHTML = rel.map(scard).join("");
  $$("[data-play-song]", view).forEach((b) => b.onclick = (e) => { e.preventDefault(); player.play(D.BY_ID.get(b.dataset.playSong)); AD.go("#/jukebox"); });
  $$("[data-v]", view).forEach((b) => b.onclick = () => { player.play(s, s.videos[+b.dataset.v]); AD.go("#/jukebox"); });
  const sp = $("#s-play"); if (sp) sp.onclick = () => { player.play(s); AD.go("#/jukebox"); };
  $("#s-like").onclick = () => { AD.toggleList("likes", s.id, !AD.isLiked(s.id)); renderSong(id); };
  $("#s-never").onclick = () => { AD.toggleList("never", s.id, !AD.isNever(s.id)); renderSong(id); };
  const pl = $("#pl"); if (pl) pl.onclick = () => { player.setFilters({ moods: s.moods }); player.start(); AD.go("#/jukebox"); };
}

/* ---- jukebox ---- */
let stageVid = null, sheetOpen = false, findRaag = "", findSinger = "";
function renderJukebox() {
  const c = player.current, stage = $("#stage");
  setSeason((c && c.song.season) || curSeason());
  if (!c) { stageVid = null; stage.innerHTML = `<div class="empty">${scene(curSeason(), 800, 450)}<p style="position:relative">${player.pool().length ? t("pressPlay") : t("noPool")}</p>${player.pool().length ? "" : `<button class="btn ghost" id="st-clear" type="button" style="position:relative">${t("clearAll")}</button>`}</div>`; const sc = $("#st-clear"); if (sc) sc.onclick = player.clearFilters; }
  else if (player.playing) { if (stageVid !== c.video.id + state.premium) { stageVid = c.video.id + state.premium; stage.innerHTML = `<iframe src="${AD.ytEmbed(c.video)}" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; } }
  else { stageVid = null; stage.innerHTML = `<img src="${AD.thumb(c.video)}" alt=""><div class="paused"><button type="button" id="st-play" aria-label="${t("resume")}">${icon("i-play")}</button></div>`; $("#st-play").onclick = player.toggle; }
  $("#now").innerHTML = !c ? `<p class="hint">${t("nowPlaying")} —</p>` : `<div class="kick">${t("nowPlaying")}${c.song.season ? ` · ${nameOf("season", c.song.season)}` : ""}</div><h2><a href="${songHref(c.song)}">${esc(AD.title(c.song))}</a></h2>${AD.title2(c.song) ? `<p class="t2">${esc(AD.title2(c.song))}</p>` : ""}
    <p class="meta">${(c.video.singers || []).length ? `${t("singer")}: <b>${esc(c.video.singers.map((x) => nameOf("singer", x)).join(", "))}</b> · ` : ""}${[nameOf("parjay", c.song.parjay), nameOf("raag", c.song.raag), nameOf("taal", c.song.taal)].filter(Boolean).map(esc).join(" · ")}</p>
    <div class="chips">${(c.song.moods || []).map((m) => `<a class="chip" href="#/list/mood/${enc(m)}">${esc(nameOf("mood", m))}</a>`).join("")}</div>`;
  $("#seek").style.visibility = c ? "visible" : "hidden"; renderProgress();
  $("#ctls").innerHTML = `<button class="rnd" type="button" id="j-like" aria-pressed="${!!(c && AD.isLiked(c.song.id))}" aria-label="${t("like")}"${c ? "" : " disabled"}>${icon(c && AD.isLiked(c.song.id) ? "i-heart-f" : "i-heart")}</button>
    <button class="rnd" type="button" id="j-prev" aria-label="${t("prev")}"${player.history.length ? "" : " disabled"}>${icon("i-prev")}</button>
    <button class="big" type="button" id="j-pp" aria-label="${!c ? t("play") : player.playing ? t("pause") : t("resume")}"${!c && !player.pool().length ? " disabled" : ""}>${icon(c && player.playing ? "i-pause" : "i-play")}</button>
    <button class="rnd" type="button" id="j-next" aria-label="${t("next")}"${c ? "" : " disabled"}>${icon("i-next")}</button>
    <button class="rnd" type="button" id="j-filters" aria-label="${t("filters")}">${icon("i-tune")}</button>`;
  $("#j-like").onclick = player.likeCurrent; $("#j-prev").onclick = player.prev; $("#j-pp").onclick = player.toggle; $("#j-next").onclick = player.next; $("#j-filters").onclick = () => openSheet(true);
  $("#jacts").innerHTML = c ? `<a class="btn sm ghost" href="${AD.askAiUrl(c.song)}" target="_blank" rel="noopener" title="${t("askAiT")}">${icon("i-spark")} ${t("askAi")}</a><a class="btn sm ghost" href="${AD.ytWatch(c.video)}" target="_blank" rel="noopener">${icon("i-yt")} ${t("openYt")}</a><button class="btn sm ghost" type="button" id="j-never">${t("never")}</button>` : "";
  const jn = $("#j-never"); if (jn) jn.onclick = player.neverCurrent;
  $("#next").innerHTML = c && player.upNext ? `${t("upNext")}: <a href="${songHref(player.upNext.song)}">${esc(AD.title(player.upNext.song))}</a>` : "";
  $("#jl").innerHTML = c && c.song.lyrics ? `<div class="jl"><pre class="lyrics">${esc(c.song.lyrics)}</pre></div>` : "";
  renderFilterBar(); renderQueue();
}
function renderFilterBar() {
  const chips = player.activeChips(), n = player.pool().length;
  $("#fbar").innerHTML = `<span class="cnt">${t("toPlay", n)}</span><div class="act">${chips.length ? chips.map(([k, v, l]) => `<button class="chip x" type="button" data-k="${k}" data-v="${esc(v)}" aria-label="${t("remove")} ${esc(l)}">${esc(l)}</button>`).join("") : `<span class="hint">${t("allRec")}</span>`}</div><button class="btn sm soft" type="button" id="f-edit">${icon("i-tune")} ${t("filters")}</button>`;
  $$("#fbar [data-k]").forEach((b) => b.onclick = () => player.toggleFilter(b.dataset.k, b.dataset.v));
  $("#f-edit").onclick = () => openSheet(true);
  if (sheetOpen) renderSheet();
}
function openSheet(open) { sheetOpen = open; $("#sheet").hidden = !open; $("#sheet-bg").hidden = !open; if (open) renderSheet(); }
function renderSheet() {
  const F = player.F, pills = (key, values, kind) => `<div class="chips">${values.map((v) => { const n = player.countWith(key, v), onn = Array.isArray(F[key]) ? F[key].includes(v) : F[key] === v; return `<button type="button" class="chip" data-fk="${key}" data-fv="${esc(v)}" aria-pressed="${onn}"${n || onn ? "" : " disabled"}>${esc(nameOf(kind, v))} <small>${num(n)}</small></button>`; }).join("")}</div>`;
  const withRec = D.SONGS.filter(AD.hasRec), raags = [...new Set(withRec.map((s) => s.raag).filter(Boolean))].sort(), singers = [...new Set(withRec.flatMap(AD.singersOf))].sort();
  const top = (names, q, key) => AD.findNames(names, q).filter((v) => player.countWith(key, v) || F[key] === v).slice(0, q ? 20 : 10);
  const find = (id, val, label) => `<div class="find"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="${id}" type="search" value="${esc(val)}" placeholder="${t("typeFind")}" aria-label="${label}"></div>`;
  $("#sheet").innerHTML = `<div class="handle"></div><h3>${t("filters")} <span><button class="btn sm ghost" type="button" id="sh-clear">${t("clearAll")}</button> <button class="btn sm" type="button" id="sh-done">${t("done")}</button></span></h3>
    <div class="grp"><h4>${t("mood")}</h4>${pills("moods", Object.keys(D.META.moods), "mood")}</div>
    <div class="grp"><h4>${t("season")}</h4>${pills("seasons", AD.SEASON_ORDER, "season")}</div>
    <div class="grp"><h4>${t("parjay")}</h4>${pills("parjays", AD.groupsOf("parjay").map(([v]) => v), "parjay")}</div>
    <div class="grp"><h4>${t("raag")}</h4>${find("fr", findRaag, t("raag"))}${pills("raag", top(raags, findRaag, "raag"), "raag")}</div>
    <div class="grp"><h4>${t("singer")}</h4>${find("fs", findSinger, t("singer"))}${pills("singer", top(singers, findSinger, "singer"), "singer")}</div>
    <div class="grp"><label class="tog"><input type="checkbox" id="fl"${F.likedOnly ? " checked" : ""}> ${t("likedOnly")}</label></div>`;
  $$("#sheet [data-fk]").forEach((b) => b.onclick = () => player.toggleFilter(b.dataset.fk, b.dataset.fv));
  $("#fr").oninput = (e) => { findRaag = e.target.value; renderSheet(); $("#fr").focus(); $("#fr").setSelectionRange(99, 99); };
  $("#fs").oninput = (e) => { findSinger = e.target.value; renderSheet(); $("#fs").focus(); $("#fs").setSelectionRange(99, 99); };
  $("#fl").onchange = () => player.toggleFilter("likedOnly"); $("#sh-clear").onclick = player.clearFilters; $("#sh-done").onclick = () => openSheet(false);
}
function renderQueue() {
  const list = player.queue(), pl = player.playlist;
  $("#qh").textContent = pl ? `${t("yourPlaylist")}: ${pl.label || ""}` : t("inSelection");
  $("#qn").textContent = pl ? `${num(Math.min(pl.idx + 1, list.length))} / ${num(list.length)} · ${t("thenMore")}` : t("songsCount", list.length);
  const shown = player.queueAll ? list : list.slice(0, 25);
  $("#queue").innerHTML = shown.map((s) => { const sg = AD.singersOf(s).map((x) => nameOf("singer", x)), isNow = s === player.current?.song, isNext = s === player.upNext?.song;
    return `<li class="${isNow ? "now" : ""}"><div class="thw"><img class="th" src="${AD.thumb(s.videos[0], "mqdefault")}" alt="" loading="lazy"><button type="button" data-pid="${esc(s.id)}" aria-label="${t("play")} ${esc(AD.title(s))}">${icon("i-play")}</button></div>
      <div style="min-width:0"><a class="t" href="${songHref(s)}">${esc(AD.title(s))}${AD.isLiked(s.id) ? ` <span class="lk">♥</span>` : ""}${isNow ? `<span class="tag">${t("nowPlaying")}</span>` : isNext ? `<span class="tag">${t("upNext")}</span>` : ""}</a><span class="s">${sg.length ? sg.map((x) => x === nameOf("singer", player.F.singer) ? `<b>${esc(x)}</b>` : esc(x)).join(", ") : t("unknownSinger")}</span></div>
      <div class="ex"><a class="btn ic sm ghost" href="${AD.askAiUrl(s)}" target="_blank" rel="noopener" title="${t("askAi")}" aria-label="${t("askAi")}">${icon("i-spark")}</a><a class="btn ic sm ghost" href="${AD.ytWatch(s.videos[0])}" target="_blank" rel="noopener" title="${t("openYt")}" aria-label="${t("openYt")}">${icon("i-yt")}</a></div></li>`; }).join("") || `<li class="hint" style="display:block;padding:10px 4px">${t("noPool")}</li>`;
  $$("#queue [data-pid]").forEach((b) => b.onclick = () => player.play(D.BY_ID.get(b.dataset.pid)));
  const qm = $("#qmore"); qm.hidden = list.length <= 25; qm.textContent = player.queueAll ? t("showFewer") : t("showAll", list.length); qm.onclick = () => { player.queueAll = !player.queueAll; renderQueue(); };
}

/* ---- mine ---- */
function renderMine() {
  const view = $("#view"), likes = state.likes.map((id) => D.BY_ID.get(id)).filter(Boolean), never = state.never.map((id) => D.BY_ID.get(id)).filter(Boolean), recent = state.recent.slice().reverse().slice(0, 12).map((id) => D.BY_ID.get(id)).filter(Boolean);
  view.innerHTML = `<div class="list-h" style="margin-top:18px"><h1>${t("mineH")}</h1></div>
    <div class="card acct"><span class="avatar ${state.signedIn ? "in" : ""}" aria-hidden="true">${state.signedIn ? "Y" : "S"}</span><div><p><b>${state.signedIn ? esc(state.email) : t("notSigned")}</b></p><p class="hint">${state.signedIn ? t("syncedAs", state.email) : t("localOnly")}</p></div>${state.signedIn ? `<button class="btn sm ghost" id="m-out" type="button">${t("signOut")}</button>` : `<button class="btn ghost" id="m-in" type="button">${icon("i-g")} ${t("signIn")}</button>`}</div>
    <section class="sec"><div class="sec-h"><h2>${t("likedSongs")}</h2><span class="hint">${t("songsCount", likes.length)}</span>${likes.some(AD.hasRec) ? `<button class="btn sm more" id="m-play" type="button">${icon("i-play")} ${t("playAll")}</button>` : ""}</div><div id="m-likes"></div></section>
    <section class="sec"><div class="sec-h"><h2>${t("recentH")}</h2></div><div class="row" id="m-recent">${recent.map(scard).join("") || `<p class="hint">${t("none")}</p>`}</div></section>
    <section class="sec"><div class="sec-h"><h2>${t("hiddenSongs")}</h2><span class="hint">${t("songsCount", never.length)}</span></div><ul class="rows">${never.map((s) => `<li><a href="${songHref(s)}"><span class="t">${esc(AD.title(s))}</span><span class="m"><button class="btn sm ghost" type="button" data-un="${esc(s.id)}">${t("remove")}</button></span></a></li>`).join("") || `<li class="div">${t("none")}</li>`}</ul></section>`;
  if (likes.length) $("#m-likes").append(songList(likes, { toggle: false })); else $("#m-likes").innerHTML = `<div class="card empty"><b>${t("noneLiked")}</b><p>${t("noneLikedHint")}</p></div>`;
  const mi = $("#m-in"); if (mi) mi.onclick = () => { AD.signIn(); renderMine(); }; const mo = $("#m-out"); if (mo) mo.onclick = () => { AD.signOut(); renderMine(); };
  const mp = $("#m-play"); if (mp) mp.onclick = () => { player.setFilters({ likedOnly: true }); player.start(); AD.go("#/jukebox"); };
  $$("[data-un]", view).forEach((b) => b.onclick = (e) => { e.preventDefault(); AD.toggleList("never", b.dataset.un, false); renderMine(); });
  $$("[data-play-song]", view).forEach((b) => b.onclick = (e) => { e.preventDefault(); player.play(D.BY_ID.get(b.dataset.playSong)); AD.go("#/jukebox"); });
}

/* ---- router ---- */
function route() {
  cur = AD.parseHash(); const p = cur.page, parts = cur.parts;
  document.body.dataset.page = p; $("#jukebox").hidden = p !== "jukebox"; $("#view").hidden = p === "jukebox";
  if (p !== "jukebox" && p !== "song" && !(p === "list" && parts[1] === "season")) setSeason(curSeason());
  renderNav(); renderResume(); renderBar(); openSheet(false);
  if (p === "jukebox") { renderJukebox(); window.scrollTo(0, 0); return; }
  if (p === "song") renderSong(parts[1]); else if (p === "browse") renderBrowse(parts[1]);
  else if (p === "list" && parts[1] === "parjay") renderList("parjay", parts[2], parts[3] || ""); else if (p === "list") renderList(parts[1], parts.slice(2).join("/"));
  else if (p === "mine") renderMine(); else renderHome();
  window.scrollTo(0, 0); if (p !== "home") $("#view").focus({ preventScroll: true });
}
AD.load().then((d) => {
  D = d;
  $("#lang").onclick = () => AD.setLang(state.lang === "bn" ? "en" : "bn"); $("#theme").onclick = AD.toggleTheme;
  $("#acct").onclick = (e) => { e.stopPropagation(); const p = $("#pop"); p.hidden = !p.hidden; $("#acct").setAttribute("aria-expanded", String(!p.hidden)); if (!p.hidden) renderPop(); };
  document.addEventListener("click", (e) => { if (!$("#pop").hidden && !e.target.closest("#pop")) { $("#pop").hidden = true; $("#acct").setAttribute("aria-expanded", "false"); } });
  $("#sheet-bg").onclick = () => openSheet(false);
  on("lang", () => { renderPop(); route(); }); on("account", () => { renderNav(); if (!$("#pop").hidden) renderPop(); });
  on("player", () => { renderBar(); renderResume(); if (cur.page === "jukebox") renderJukebox(); }); on("progress", renderProgress);
  on("filters", () => { if (cur.page === "jukebox") { renderFilterBar(); renderQueue(); } }); on("prefs", () => { renderBar(); if (cur.page === "jukebox") renderJukebox(); });
  window.addEventListener("hashchange", route); route();
});
})();
</script>
